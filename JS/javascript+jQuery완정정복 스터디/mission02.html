<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>계산기를 클래스로 만들기</title>
    <script src="https://code.jquery.com/jquery-3.4.1.js" integrity="sha256-WpOohJOqMqqyKL9FccASB9O0KwACQJpFTUBLTYOVvVU=" crossorigin="anonymous"></script>
    <script>

    $(document).ready(function(){
        // 계산기 인스턴스 생성
        var cal = new Calculator();
    });

    function Calculator(){
        // 프로퍼티 선언
        this.$value1 = null;
        this.operator = null;
        this.$value2 = null;
        this.$output = null;

        // 요소 초기화 메서드 호출
        this.init();
        // 이벤트 초기화 메서드 호출
        this.initEvent();
    }


    // 이벤트 초기화
    Calculator.prototype.initEvent = function(){
        var objThis = this;
        $("#cal").click(function(){
            // 메서드 호출
            objThis.exeCalculate();
        });
    }

    // 요소 초기화
    Calculator.prototype.init = function(){
        // 계산기 내부에서 계속해서 사용할 노드를 미리 찾아 변수에 담아 줍니다.
        this.$value1 = $("#val1");
        this.operator = $("#op");
        this.$value2 = $("#val2");
        this.$output = $("#output");
    }

    // 입력 정보를 구한 후 계산 메서드 호출
    Calculator.prototype.exeCalculate = function(){
        // 입력 정보 구하기
        var val1 = parseInt(this.$value1.val());
        var operator = this.operator.val();
        var val2 = parseInt(this.$value2.val());


        // 사칙연산 메서드 실행
        this.calculate(operator,val1,val2);
    }

    Calculator.prototype.calculate = function(op, num1, num2){
        var result="";
        console.log(num1);
            console.log(op);
            console.log(num2);
        switch(op){
            case "+":
                result = num1+num2;
                break
            case "-":
                result = num1-num2;
                break
            case "*":
                result = num1*num2;
                break
            case "/":
                result = num1/num2;
                break
            default :
                result = "지원하지 않는 연산자 입니다.";
        }
        
        // 계산 정보를 출력 영역에 출력
        this.$output.html(result);
    }

    


    

  

    </script>
</head>
<body>
    <div>
        숫자1:<input id="val1">,
        연산자:<input id="op">,
        숫자2:<input id="val2">
        <button id="cal">확인</button>
    </div>
    <div id="output">
        여기에 결과를 출력해 주세요.
    </div>
</body>
</html>
