    My99DAN.prototype.printdan = function(dan){
        var result = "";
        for(var i = 1; i < 9; i++){
            result += dan + " * " + i + "=" + (dan*i)+"<br/>"
        }
        this.$output.html(result);
    }

    My99DAN.prototype.print3dan = function(dan){
        this.printdan(3);
    }
    My99DAN.prototype.print6dan = function(){
        this.printdan(6);
    }
    My99DAN.prototype.print9dan = function(){
        this.printdan(9);
    }

    My99DAN.prototype.clear = function(){
        this.$output.html("");
    }

    $(document).ready(function(){
        var my99dan = new My99DAN();
        $("#3dan").click(function(){
            my99dan.print3dan(3);
        });
        $("#6dan").click(function(){
            my99dan.print6dan(6);
        });
        $("#9dan").click(function(){
            my99dan.print9dan(9);
        });
        $("#clear").click(function(){
            my99dan.clear();
        });
    });
