<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>4.2 Element 노드 리스트 선택 및 생성하기</title>
</head>
<body>
    <!--
    HTML문서 내의 노드 리스트(NodeList)를 선택 및 생성하는 데 가장 흔히 사용되는 메서드는 다음과 같다.
        querySelectorAll()
        getElementsByTagName()
        getElementsByClassName()
    -->

    <ul>
        <li class="liClass">Hello</li>
        <li class="liClass">big</li>
        <li class="liClass">bad</li>
        <li class="liClass">world</li>
    </ul>

    <script>
        // 다음 메서드들은 모두 DOM 내의 <li> element 리스트를 동일하게 생성 및 선택한다.
        console.log(document.querySelectorAll('li'));
        console.log(document.getElementsByTagName('li'));
        console.log(document.getElementsByClassName('liClass'));

        //var test = document.querySelectorAll('li');
        //for (var i = 0; i < test.length; i++) {
        //    console.log(test[i].textContent);
        //}

        // 이 코드 예제에서 사용된 메서드들은 특정 element 하나를 선택하는 것이 아니라, 선택한 element들의 리스트(NodeList)를 생성한다.
        /*
        getElementsByTagName()과 getElementsByClassName()으로 생성된 NodeList는 라이브 상태로 간주되며, 리스트를 생성하고 선택한 후에 문서가 업데이트된 경우에도
        문서의 상태를 항상 반영한다.
        querySelectorAll() 메서드는 라이브 ㅏㅇ태의 element 리스트를 반환하지 않는다.
        이는 querySelectorAll()에서 반환하는 리스트는 리스트 생성 시점의 문서 스냅샷이며, 문서의 변경 내용을 반영하지 않는다는 것을 의미한다.
        해당 리스트는 정적이며, 라이브 상태가 아니다.
        querySelectorAll(), getElementsByTagName(), getElementsByClassName()은 element 노드에도 정의되어 있다. 그 덕분에 메서드의 결과를 DOM 트리의 특정 부분(혹은 일련의 부분)에 한정할 수 있다.
        (예:document.getElementById('header').getElementsByClass Name('a'))

        getElementsByName() 메서드를 언급하지 않았는데, 일반적으로 다른 방안들에 비해 효용성이 떨어지기 때문이다.
        하지만 문서에서 동일한 name attribute 값을 가진 form, img, frame, embed, object element를 선택할 때는 이 메서드가 있다는 것을 알아둘 필요가 있다
        querySelectorAll() 이나 getElementsByTagName()에 문자열 '*'(일반적으로 "전체"를 의미)를 전달하면, 문서 내의 모든 element 리스트를 반환한다.

        childNodes도 queryElectorAll(), getElementsByTagName(), getElementsByClassName() 처럼 NodeList를 반환한다는 것을 명심하기 바란다.

        NodeList는 유사 배열 리스트/컬렉션이며, 읽기 전용인 length 속성(array의 메서드를 상속받은 것은 아님)을 가진다.
        */

    </script>
</body>
</html>
