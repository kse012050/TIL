<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>4.4 컨텍스트 기반 Element 선택</title>
</head>
<body>
    <!--
    통상적으로 document 개체를 통해 접근되는 querySelector(), querySelectorAll(), getElementsByTagName(), getElementsByClassName()은
    element 노드에도 정의되어 있다.
    이는 해당 매서드의 결과를 DOM 트리의 특정 부분(혹은 일련의 부분들)으로 제한 할 수 있게 해준다.
    달리 말해, element 노드 개체에서 이 메서드를 호출하면, element 노드를 검색하고자 하는 특정 컨텍스트를 선택할 수 있다는 것이다.
        -->
    <div>
        <ul>
            <li class="liClass">Hello</li>
            <li class="liClass">big</li>
            <li class="liClass">bad</li>
            <li class="liClass">world</li>
        </ul>
    </div>

    <ul>
        <li class="liClass">Hello</li>
    </ul>

    <script>
        // div의 콘텐츠에 대해서만 선택 메서드를 실행하기 위해 div를 컨텍스트로 선택
        var div = document.querySelector('div');

        console.log(div.querySelector('ul'));
        console.log(div.querySelectorAll('li'));
        console.log(div.getElementsByTagName('li'));
        console.log(div.getElementsByClassName('liClass'));
    </script>
</body>
</html>
