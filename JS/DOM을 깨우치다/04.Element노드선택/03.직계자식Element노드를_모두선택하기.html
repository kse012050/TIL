<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>4.3 직계 자식 Element 노드를 모두 선택하기</title>
</head>
<body>
    <!--
    element 노드에서 children 속성을 사용하면, element 노드의 직계 자식 노드 전체 리스트(HTMLCollection)를 얻을 수 있다.
        -->
    
    <ul>
        <li><strong>Hi</strong></li>
        <li>there</li>
    </ul>

    <script>
        var ulElement = document.querySelector('ul').children;

        // 모든 직계 자식 element 노드 리스트/배열을 출력
        console.log(ulElement);     //[<li>, <li>]를 출력

        // children은 직계 element 노드만을 제공하며, element가 아닌 노드(예: text 노드)는 제외된다. element에 자식이 없는 경우, children은 빈 유사 배열 리스트를 반환한다.

        /*
        HTMLCollection은 element를 문서 내의 순서대로 가진다. 즉 element가 DOM에 나타나는 순서대로 배열 내에 위치한다.

        HTMLCollection은 라이브 상태이므로, 문서가 변경되면 동적으로 컬렉션에 반영된다.
        */
    </script>
</body>
</html>
