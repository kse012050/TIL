<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>2.4 document 자식 노드</title>
</head>
<body>
    <!--
        document 노드는 DocumentType 노드 개체 하나와 Element 노드 개체 하나를 가질 수 있다.
        통상적으로 HTML 문서는 하나의 doctype(예: <!DOCTYPE html>)과 하나의 element(예:<html lang="en">) 만을 가지므로, 별로 노라울 것은 없다.
        따라서 document 개체의 자식에 대해 물어보면(예: document.childNodes), 최소한 문서의 doctype/DTD 와 <html lang="en">이 포함된 배열을 얻게 될 것이다
        -->
    
    <script>
        // doctype/DTD
        console.log(document.childNodes[0].nodeType)    // DOCUMENT_TYPE_NODE를 의미하는 숫자 키 10이 출력된다.

        // <html> element
        console.log(document.childNodes[1].nodeType)    // ELEMENT_TYPE_NODE를 의미하는 숫자 키 1이 출력된다.

        // HTMLDocument 생성자에서 생성되는 window.document 개체와 Document 개체를 혼동해서는 안된다. 
        // window.document가 DOM 인터페이스의 시작점이라는 것만 기억하자
        // Docuemnt.childNodes가 자식 노드를 가지고 있는 이유가 바로 이때문이다.
        // comment 노드(이 책에서는 다루지 않음)가 <html lang="en"> elemnet 외부에 있는경우, window.document의 자식 노드가 된다. 
        // 하지만 <html> element 외부에 comment 노드를 두는 것은 IE에서 잘못된 결과가 야기 될 수 있으며, DOM 사양을 위반하는 것이다.
    </script>
</body>
</html>
