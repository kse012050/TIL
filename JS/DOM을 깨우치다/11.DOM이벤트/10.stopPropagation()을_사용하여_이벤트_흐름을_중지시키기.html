<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>11.10 stopPropagation()을 사용하여 이벤트 흐름을 중지시키기</title>
</head>
<body>
    <!--
    이벤트 핸들러/수신기 내에서 stopPropagation()을 호출하면 갭처/버블링 이벤트 흐름단계가 중지되지만, 노드나 개체에 직접 연결된 이벤트는 여전히 호출된다.

    다음 코드에서는 <div>를 클릭했을 때 이벤트가 DOM으로 버블링되지 않도록 중지시켜서 <body>에 연결된 onclick 이벤트가 절대 호출되지 않는다.
    -->

    <div>click me</div>

    <script>
        document.querySelector('div').addEventListener('click', function () {
            console.log('me too, but nothing from the event flow! / 나도 그래도 이벤트 흐름에는 아무 것도 없어!');
        }, false);

        document.querySelector('div').addEventListener('click', function (event) {
            console.log('invoked all click events attached, but cancel capture and bubble event phases / 첨부 된 모든 클릭 이벤트가 호출되지만 캡처 및 버블 이벤트 단계는 취소됩니다.');
            event.stopPropagation();
        }, false);

        document.querySelector('div').addEventListener('click', function () {
            console.log('me too, but nothing from the event flow! / 나도 그래도 이벤트 흐름에는 아무 것도 없어!');
        },false);
        
        // <div>가 클릭되어도 <div>에 연결된 이벤트에서 캡처 및 버블 흐름을 중지 키셨기에, 아래 이벤트가 호출되지 않는다
        document.body.addEventListener('click', function () {
            console.log('what, denied from being invoked! / 뭐, 부름에서 거부 당했어!');
        }, false);

        /*
        <div>에 연결된 다른 click 이벤트는 여전히 호출된다. 추가적으로 stopPropagation()은 기본 이벤트를 막지 앟는다.
        코드 예제에서 <div> 가 href 값을 가진 <a> 였으면, stopPropagation을 호출하더라도 브라우저 기본 이벤트가 호출되는 것을 막지 못했을 것이다.
        */
    </script>
</body>
</html>
