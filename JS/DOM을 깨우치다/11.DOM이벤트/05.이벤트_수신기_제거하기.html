<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>11.5 이벤트 수신기 제거하기</title>
</head>
<body>
    <!--
    원래 수신기가 익명 함수로 추가되지 않았다면, removeEventListener() 메서드를 사용하여 이벤트 수신기를 제거할 수 있다.

    다음 코드에서는 HTML 문서에 두 개의 이벤트 수신기를 추가하고, 제거하려고 시도한다.
    하지만 함수 참조를 ㅏ용하여 연결된 수신기만 제거된다.
    -->

    <div>click to say hi</div>

    <script>
        var sayHi = function () { console.log('hi') };

        // 익명 함수를 사용하여 이벤트 수신기를 추가
        document.body.addEventListener('click', function () { console.log('dude'); }, false);

        // 함수 참조를 사용하여 이벤트 수신기를 추가
        document.querySelector('div').addEventListener('click', sayHi, false);

        // 이벤트 수신기를 둘 다 제거하려고 시도하나, 함수 참조로 추가된 수신기만 제거 된다.
        document.querySelector('div').removeEventListener('click', sayHi, false);

        // removeEventListener로 전달된 함수는 완전히 새로운 다른 함수이므로, 아래 코드는 제데로 동작하지 않는다.
        console.body.removeEventListener('click', function () { console.log('dude'); }, false);

        // div를 클릭하면 body element에 연결된 click 이벤트가 제거 되지 않아 여전히 발생된다.

        // addEventListener() 메서드를 사용하여 추가된 익명 함수는 제거가 불가능하다.
    </script>
</body>
</html>
