<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>11.12 사용자 정의 이벤트</title>
</head>
<body>
    <!--
    개발자는 사전 정의된 이벤트 형식만으로 제한받지 않는다. addEventListener() 메서드를
    document.createEvent(), initCustomEvent(), dispatchEvent()와 조합해서 사용하면 사용자 정의 이벤트를 연결해서 호출할 수 있다.

    다음 코드에서는 goBigBlue라는 사용자 정의 이벤트를 생성해서 호출한다.
    -->

    <div>click me</div>

    <script>
        var divElement = document.querySelector('div');

        // 사용자 정의 이벤트 생성
        var cheer = document.createEvent('CustomEvent');      // 'CustomEvent' 매개변수가 필요함

        // 사용자 정의 이벤트에 대한 이벤트 수신기 생성
        divElement.addEventListener('goBigBlue', function (event) {
            console.log(event.detail.goBigBlueIs);
        }, false);

        // initCustomEvent 메서드를 사용하여 사용자 정의 이벤트를 상세하게 설정한다.
        // initCustomEvent의 매개변수는 event, bubble?, cancelable?, event.detail로 전달될 값이다

        cheer.initCustomEvent('goBigBlue', true, false, { goBigBlueIs: 'its gone!' });

        // dispatchEvent를 사용하여 사용자 정의 이벤트를 호출
        divElement.dispatchEvent(cheer);

        /*
        IE9은 initCustomEvent()에서 4번째 매개변수를 필요로 하며, 선택이 아니라 DOM4 사양서에서는 사용자 정의 이벤트의 주기를 단순화 시켜주는
        CustomEvent()생성자가 추가되었지만, IE9에서는 지원되지 앟으며, 이글을 쓰는 도중에도 유동적이다.
        */
    </script>
</body>
</html>
