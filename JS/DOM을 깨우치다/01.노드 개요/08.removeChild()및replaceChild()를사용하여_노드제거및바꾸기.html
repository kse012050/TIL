<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>removeChild() 및 replaceChild()를 사용하여 노드 제거 및 바꾸기</title>
</head>
<body>
    <div id="A">Hi</div>
    <div id="B">Dude</div>

    <script>
        //removeChilde()
        //element 노드 삭제
        var divA = document.getElementById('A');
        divA.parentNode.removeChild(divA);

        // 텍스트 노드 삭제
        var divB = document.getElementById('B').firstChild;
        divB.parentNode.removeChild(divB);

        //새롭게 갱신된 DOM을 출력(빈 div#B만 남아있어야 함).
        console.log(document.body.innerHTML);

    </script>

    <div id="C">Hi</div>
    <div id="D">Dude</div>

    <script>
        //replaceChild()
        //element 노드 바꾸기
        var divC = document.getElementById('C');
        var newSpan = document.createElement('span');
        newSpan.textContent = 'Howdy';
        divC.parentNode.replaceChild(newSpan, divC);

        // 텍스트 노드 바꾸기.
        var divD = document.getElementById('D').firstChild;
        var newText = document.createTextNode('buddy');
        divD.parentNode.replaceChild(newText, divD);

        //새롭게 갱신된 DOM을 출력
        console.log(document.body.innerHTML);

        // 제거하거나 바꾸는 대상이 무엇인지에 따라 innerHTML, outerHTML, textContent 속성에 빈 문자열을 주는 것이 더 쉽고 빠를 수 있다.
        // 하지만 브라우저의 메모리 누수가 발생할 수 있으므로 조심해야 한다.

        // replaceChild() 및 removeChild()는 각각 교체되거나 제거된 노드를 반환한다.
        // 기본적으로 해당 노드는 바꾸거나 제거하는 것이므로 자라지지 않는다.
    </script>
</body>
</html>
