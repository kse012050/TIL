<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>직계 자식 노드 전부에 대한 리스트/컬렉션 얻기</title>
</head>
<body>
    <ul>
        <li>Hi</li>
        <li>there</li>
    </ul>

    <script>
        var ulElementChildNodes = document.querySelector('ul').childNodes;

        console.log(ulElementChildNodes);   // ul 내의 전체 노드로 이루어진 유사 배열 리스트를 출력

        // NodeList에 대해 루프를 돌 수 있도록 NodeList의 메서드인 forEach를 호출함.
        // NodeLists가 유사 배열이라 가능한 것이며, Array로부터 직접 상속받은 것은 아님

        Array.prototype.forEach.call(ulElementChildNodes, function (item) {
            console.log(item);      //배열 내의 각 항목을 출력
        });

        // childNodes에서 반환되는 NodeList는 직계 자식 노드만을 가진다.
        //childNodes가 Element 노드뿐만 아니라 다른 노드 유형(예: Text 및 Comment노드)도 포함한다는 점에 유의한다
    </script>
</body>
</html>
