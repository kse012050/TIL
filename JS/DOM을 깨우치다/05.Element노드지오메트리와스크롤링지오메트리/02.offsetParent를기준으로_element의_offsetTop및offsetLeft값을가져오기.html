<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>5.2 offsetParent를 기준으로 element의 offsetTop 및 offsetLeft값을 가져오기</title>
    <style>
        #blue{height:100px; width:100px; background-color:blue; border:10px solid gray; padding:25px; margin:25px;}
        #red{height:50px; width:50px; background-color:red; border:10px solid gray;}
    </style>
</head>
<body>
    <!--
    offsetTop 및 offsetLeft 속성을 사용하면, offsetParent로부터 element 노드의 오프셋 픽셀 값을 가져올 수 있다.
    이 element 노드 속성들은 element의 바깥쪽 좌상 단 경계로부터 offsetParent의 안쪽 좌상단 경계까지의 거리를 픽셀로 제공해준다.
    offsetParent의 값은 가장 가까운 부모 element중에서 CSS 위치 값 static이 아닌 element를 검색하여 결정된다.
    아무 element도 발견되지 않으면, offsetParent의 값은 <body> element나 "document"에 해당하는 것(브라우저의 viewport와는 다름)이 된다.
    부모를 탐색하는 동안 CSS 위치 값이 static인 <td>, <th>, <table> element가 발견되면 이 element가 offsetParent 값이 된다

        static:공전(기본값인듯)    off set Parent:부모를 벗어난 세트
    -->

    <div id="blue"><div id="red"></div></div>

    <script>
        var div = document.querySelector('#red');

        console.log(div.offsetLeft);        // 60이 출력됨.   68이 출력되는데 뭐지      어쨋든 중요한건 왼쪽 위를 기준으로 거리를 제공한다는것이다.
        console.log(div.offsetTop);         // 60이 출력됨
        console.log(div.offsetParent);      // <body>가 출력됨

        /*
        앞의 코드에서 블루사각형 div가 절대 위치를 가지도록 변경하면 offsetParent의 값이 바뀐다.
        다음 코드에서 블루사각형 <div>를 절대 위치로 변경하면 offsetLeft와 offsetTop에서 반환되는 값은 25가 픽셀이 된다
        */
    </script>
    <style>
        #blue{position:absolute;}
    </style>

    <script>
        var div = document.querySelector('#red');

        console.log(div.offsetLeft);        // 25가 출력됨.
        console.log(div.offsetTop);         // 25가 출력됨
        console.log(div.offsetParent);      // <div id ="blue">가 출력됨

        /*
        브라우저에서 보이는 모양을 보면 offsetParent가 블루 사각형 <div>일 때 offsetLeft와 offsetTop에서 반환되는 새 츨정 값이 명확해진다.

        대부분의 브라우저에서는 offsetParent가 <body>이고 <body>나 <html> element가 눈에 보이는 여백(marging), 패딩(padding), 테두리 값을
        가지는 경우 바깥쪽 테두리에서 안쪾 테두리까지의 측정이 제대로 되지 않는다

        offsetParent, offsetTop, offsetLeft는 HTMLELement 개체의 확장이다.
        */
    </script>
</body>
</html>
