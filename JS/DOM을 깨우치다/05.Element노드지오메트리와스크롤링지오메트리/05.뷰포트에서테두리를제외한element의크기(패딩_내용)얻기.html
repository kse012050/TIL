<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>5.5 뷰포트에서 테두리를 제외한 element의 크기(패딩+내용)얻기</title>
</head>
<body>
    <!--
    clientWidth와 clientHeight 속성은 테두리 크기를 제외하고 element의 내용과 패딩을 더해서 element의 전체 크기를 반환한다.
    다음 코드에서는 이 두 속성을 사용하여 패딩은 포함하되 테두리는 제외한 element의 높이와 너비를 얻는다

        여기서 말하는 테두리는 margin을 말하는 것 인가

        client:고객
        -->
    <style>
        div { height: 25px; width: 25px; background-color: red; border: 25px solid gray; padding: 25px; }
    </style>
    <div>

    </div>
    <script>
        var div = document.querySelector('div');

        console.log(div.clientHeight, div.clientWidth);     // 패딩 25 + 내용 25 + 패딩 25 = 75이므로 '75 75'가 출력됨
    </script>
</body>
</html>
