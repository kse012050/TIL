<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>5.7 scrollHeight와 scrollWidth를 사용하여 스크롤될 element의 크기를 얻기</title>
</head>
<body>
    <!--
    scrollHeight와 scrollWidth 속성은 스크롤될 노드의 높이와 너비를 제공해준다. 예를 들어 웹 브라우저에서 스크롤되는 HTML 문서를 열고 <html> 이나 <body>의 속성
    (예:document.documentElementscrollWidth나 document.body.scrollWidth)에 접근하면, 스크롤될 HTML 문서의 전체 크기를 얻을 수 있다.
    CSS를 사용하여 element에 스크롤을 적용(예:overflow:scroll)할 수 있으므로, 간단한 예제 코드를 살펴보도록하자

    다음코드에서는 <div>가 1,000 X 1,000 픽셀의 <p> element를 스크롤한다. <div>의 scrollHeight와 scrollWidth 속성에 접근하면, 스크롤될 element가 1,000 X 1,000 픽셀임을 알려준다
    -->

    <style>
        *{margin:0; padding:0;}
        div{height:100px; width:100px; overflow:auto;}
        p{height:1000px; width:1000px; background-color:red;}
    </style>

    <div><p></p></div>

    <script>
        var div = document.querySelector('div');
        console.log(div.scrollHeight, div.scrollWidth);     //'1000 1000'이 출력됨

        //스크롤 가능한 영역 내에 있는 노드ㅏ 스크롤 가능한 영역의 뷰포트보다 작은 경우 해당 노드의 높이와 너비를 알아야 한다면,
        //scrollHeight와 scrollWidth는 뷰포트의 크기를 반환하므로 사용하지 않는 것이 좋다.스크롤될 노드가 스크롤 영역보다 작은 경우,
        //스크롤 가능한 영역내의 포함된 노드의 크기를판별하려면 clientHeight와 clientWidht를 사용한다
    </script>
</body>
</html>
