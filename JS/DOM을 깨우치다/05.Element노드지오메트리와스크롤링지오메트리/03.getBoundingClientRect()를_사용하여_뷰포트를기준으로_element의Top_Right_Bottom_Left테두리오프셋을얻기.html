<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>5.3 getBoundingClientRect()를 사용하여 뷰포트를 기준으로 element의 Top Right Bottom Left 테두리 오프셋을 얻기</title>
</head>
<body>
    <!--
    getBoundingClientRect() 메서드를 사용하면, 뷰포트(Viewpert)의 좌상단 끝을 기준으로 element가 브라우저에서 그려질 때 element의 바깥쪽테두리 위치를 얻을 수 있다.
    left 및 right는 element의 바깥쪽 테두리로부터 뷰포트의 왼쪽 끝까지로 측정되며, top과 bottom은 element의 바깥쪽 테두리로부터 뷰포트의 상단 끝까지로 측정된다.

    다음 코드에서는 10픽셀의 테두리와 100픽셀의 여백을 가진 50X50 픽셀 크기의 <div>를 생성한다.
    <div>의 각 테두리 끝으로부터의 거리를 픽셀로 얻어내기 위해 <div>에서 getBoundingClientRect() 메서드를 호출하면
    top, right, bottom, left속성을 가진 개체가 반환된다.
        -->
    <style>
        div{height:50px; width:50px; background-color:red; border:10px solid gray; margin:100px;}
    </style>
    <div></div>

    <script>
        var divEdges = document.querySelector('div').getBoundingClientRect();

        console.log(divEdges.top, divEdges.right, divEdges.bottom, divEdges.left);
        // 100 170 170 100 가 출력됨    left가 8 더나옴 아무래도..음

    </script>
</body>
</html>
