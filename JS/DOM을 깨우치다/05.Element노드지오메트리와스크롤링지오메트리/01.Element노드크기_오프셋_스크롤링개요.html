<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>5.1 Element 노드 크기 오프셋 스크롤링 개요</title>
</head>
<body>
    <!--
    HTML 문서를 웹 브라우저에서 볼 때, DOM 노드가 해석되어 시작적인 모양으로 그려진다. 노드(대부분 element 노드)는 브라우저에서 볼 수 있는 시각적인 표현 형태를 가지고 있다.
        노드의 시가겆ㄱ인 형태와 지오메트리를 프로그래밍을 통해 살펴보고 조작하기 위해 일련의 API들이 존재하는데 CSSOM view Module(http://www.w3.org/TR/cssom-view)에 정의되어 있다.
        이 사양서에서 찾아볼 수 있는 메서드 및 속성의 하위 집합에서는 element 노드의 지오메트리(크기 및 오프셋을 사용한 위치)를 측정하는 것뿐만 아니라, 스크롤이 가능한 노드를 조작하기 위해 가로채고, 스크롤된 노드의 값을 가져오기 위한 API도 제동한다.
        -->

    <!--
    CSSOM View Module 사양에 있는 대부분의 속성(scrollLeft와 scrollTop은 제외)은 읽기 전용이며 접근 시마다 매번 계산된다. 즉 이 값들은 라이브 상태다.
        -->
</body>
</html>
