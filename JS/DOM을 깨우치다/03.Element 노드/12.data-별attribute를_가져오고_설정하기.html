<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>3.12 data-*attribute를 가져오고 설정하기</title>
</head>
<body>
    <!--
    element 노드의 dataset 속성은 element에서 data-*로 시작하는 모든 attribute를 가진 개체를 제공해준다.
    이 개체는 JavaScript 개체이므로, dataset을 조작해서 DOM 내의 element에 변경 내용을 반영할 수 있다.
        -->
    
    <div data-foo-foo="foo" data-bar-bar="bar"></div>

    <script>
        var elm = document.querySelector('div');

        // 가져오기 
        console.log(elm.dataset.fooFoo);    //'foo'가 출력됨
        console.log(elm.dataset.barBar);    //'bar'가 출력됨

        // 설정하기
        elm.dataset.gooGoo = 'goo';
        console.log(elm.dataset);       // DOMStringMap {fooFoo="foo" , barBar="bar" , gooGoo="goo"}이 출력됨

        // element가 DOM 내에서 어떤 모습인지를 확인하기
        console.log(elm);       // <div data-foo-foo="foo" data-bar-bar="bar" data-goo-goo="goo">가 출력됨

        // dataset은 data attribute들의 camelCase 버전을 가지고 있다. 즉 data-foo-foo는 dataset DOMStringMap 개체 내에 fooFoo라는 속성으로 나열된다.
        // 하이픈(-)은 camelCasing으로 대체된다.
        // DOM에서 data-* attribute를 제거하려면, dataset의 속성에 대해 delete 연산자를 사용하면 된다(예: delete dataset.fooFoo).
        // dataset은 IE9에서 제공되지 않으며, 외부 구현 코드(http://bit.ly/YoKOKP)가 존재한다.
        //하지만 getAttribute('data-foo'), removeAttribute('data-foo'), setAttribute('data-foo'), hasAttribute('data-foo')는 언제나 사용 가능하다.
    </script>
</body>
</html>
