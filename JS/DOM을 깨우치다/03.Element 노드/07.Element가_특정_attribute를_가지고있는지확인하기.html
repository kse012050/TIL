<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>3.7 Element가 특정 attribute를 가지고 있는지 확인하기</title>
</head>
<body>
    <!--
    element가 attribute를 가지고 있는지 판별(즉 true나 false)하기 위한 가장 좋은 방법은 hasAttribute() 메서드를 사용하는 것이다.
        -->

    <a href="#" title="title" data-foo="dataFoo" style="margin:0;" class="yes" goo ></a>

    <script>
        var atts = document.querySelector('a');

        console.log(
            atts.hasAttribute('href'),
            atts.hasAttribute('title'),
            atts.hasAttribute('style'),
            atts.hasAttribute('data-foo'),
            atts.hasAttribute('class'),
            atts.hasAttribute('goo')        // 이 코드는 값이 정의되었는지의 여부에 관계없이 true라는 점에 유의하자.
        );

        // 이 메서드는 element 가 attribute를 포함하고 있으면(attribute가 값을 가지지 않더라도) true를 반환단다.
        // 예를 들어, hasAttribute()를 사용하면 Boolean attribute의 경우Boolean 응답을 얻을 수 있다.
    </script>

    <!--
        다음에 나올 확인은 checkbox가 체크되었는지 알아보는 테스트이다.    
    -->

    <input type="checkbox" checked/>

    <script>
        var atts = document.querySelector('input');

        console.log(atts);
        console.log(atts.hasAttribute('checked'));      // true가 출려됨
    </script>
</body>
</html>
