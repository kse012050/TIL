<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>7.10 normalize()를 사용하여 형제 텍스트 노드들을 단일 텍스트 노드로 결합한다</title>
</head>
<body>
    <!--
     형제 Text 노드들은 통상적으로 텍스트를 DOM에 프로그래밍적으로 추가한 경우에만 나타난다. Element 노드를 포함하고 있지 않은 형제 Text 노드들을 제거하기 위해
     normalize()를 사용할 수 있다. 이 메서드는 DOM 내의 형제 텍스트 노드를 단일 Text노드로 결합한다.

     다음 코드에서는 형제 텍스트를 만들고, DOM에 추가한 다음, 정규화시킨다.
     -->

    <div></div>

    <script>
        var pElementNode = document.createElement('p');
        var textNodeHi = document.createTextNode('Hi');
        var textNodeCody = document.createTextNode('Cody');

        pElementNode.appendChild(textNodeHi);
        pElementNode.appendChild(textNodeCody);

        document.querySelector('div').appendChild(pElementNode);

        console.log(document.querySelector('p').childNodes.length);     // 2가 출력됨

        document.querySelector('div').normalize();      // 형제 텍스트 노드들을 결합

        console.log(document.querySelector('p').childNodes.length);     // 1이 출력됨
    </script>

</body>
</html>
