<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>7.8 textContent를 사용하여 마크업이 제거된 모든 자식 텍스트노드를 반환한다</title>
</head>
<body>
    <!--
    textContent 속성은 모든 자식 텍스트 노드를 가져오는 것뿐만 아니라, 노드의 내용을 특정 Text 노드로 설정하는데도 사용될 수 있다.
    노드의 텍스트내용을 가져오기 위해 해당 속성을 사용하면, 메서드를 호출하는 노드에 포함된 모든 텍스트 노드의 문자열을 합쳐서 반환한다.
    이 기능은 HTML 문서에서 모든 텍스트 노드를 매우 쉽게 추출할 수 있게 해준다, 

    다음 코드에서는 <body> element 내에 포함된 모든 텍스트를 추출한다.
    textContext는 직계 자식 텍스트뿐만 아니라, 메서드가 호출되는 노드 내부에 캡슐화된 깊이에 관계없이 모든 자식 텍스트 노드를 취합한다는 점에 유의한다.
    -->
    <h1> Dude</h1>
    <p>you <strong>rock!</strong></p>

    <script>
        console.log(document.body.textContent);     // 공백이 추가 된 'Dude you rock!'이 출력됨

        /*
        노드 내에 포함된 텍스트를 설정하는데 textContent를 사용하면, 모든 자식 노드가 제거되고 단일 Text 노드로 바뀐다.

        다음 코드에서는 <div> element 내의 모든 노드를 단일 Text 노드로 바꾼다.
        */
    </script>

    <div>
        <h1> Dude</h1>
        <p>you <strong>rock!</strong></p>
    </div>

    <script>
        document.body.textContent = "You don't rock!";
        console.log(document.querySelector('div').textContent);     //'You don`t rock!'이 출력됨   에러남.;

        /*
        textContent는 document나 doctype 노드에서 사용될 경우 null을 반환한다.
        <script> 및 <style> element의 경우에는 내용이 반환된다.
        */
    </script>
</body>
</html>
