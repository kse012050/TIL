<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>9.7 insertRule()과 deleteRule()을 사용하여 스타일시트에 CSS규칙을 삽입하고 삭제하기</title>
</head>
<body>
    <!--
    insertRule()과 deletRule() 메서드는 스타일시트 내의 CSS 규칙을 프로그래밍적으로 조작할 수 있게 해준다.

    다음 코드에서는 insertRule()을 사용하여 인라인 스타일시트의 인덱스 1에 p{color:red;}라는 CSS 규칙을 추가한다.
    스타일시트 내의 CSS 규칙은 0부터 시작하는 인덱스를 가진다는 점에 유의한다.
    따라서, 새로운 규칙을 인덱스 1에 삽입하면, 인덱스 1에 있는 현재(p{font-size:50px;})은 인덱스 2가 된다.
    -->

    <style id="styleElement">
        body { background-color: #fff; margin: 20px; }      /*인덱스 0*/
        p { line-height: 1.4em; color: blue; }              /*인덱스 1*/
    </style>

    <p>Hi</p>

    <script>
        // 인라인 스타일시트의 인텍스 1에 새로운 CSS 규칙을 추가
        document.querySelector('#styleElement').sheet.insertRule('p{color:red}', 1);

        // 추가되었는지 확인
        console.log(document.querySelector('#styleElement').sheet.cssRules[1].cssText);

        // 방금 추가한 것을 삭제
        document.querySelector('#styleElement').sheet.deleteRule(1);

        // 삭제되었는지 확인
        console.log(document.querySelector('#styleElement').sheet.cssRules[1].cssText);

        /*
        규칙을 삭제하거나 제거하려면 스타일시트에서 deleteRule() 메서드를 호출하면서 스타일시트에서 삭제할 규칙의 인덱스를 전달하기만 하면 된다.
        */

        /*
        규칙을 삽입하고 삭제하는 것이 단계를 관리하고 숫자 인덱스 시스템을 사용하여 스타일시트를 업데이트하는 것(예: 스타일시트 자체의 내용을 사전에 보지 않고 스타일이
        위치한 인덱스의 위치를 판단)처럼 어렵게 수행되는 경우는 별로 업다. 클라이언트에서 프로그래밍적으로 변경하는 것보다 클라이언트에 서비스되기 전에 CSS ㅣㅊ HTML 파일에서 CSS 규칙에 대한 작업을 수행하는 것이 더욱 간단하다.
        */
    </script>
</body>
</html>
