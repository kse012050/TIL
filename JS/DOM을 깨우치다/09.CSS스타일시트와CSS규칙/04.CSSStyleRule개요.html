<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>9.4 CSSStyleRule 개요</title>
</head>
<body>
    <!--
    CSSStyleRule 개체는 스타일시트에 포함된 각 CSS 규칙을 표현한다. 기본적으로 CSSStyleRule은 선택자에 연결되는 CSS 속성과 값에 대한 인터페이스다.

    다음 코드에서는 스타일시트 내의 CSS규칙을 표현하는 CSSStyleRule 개체에 접근하여 인라인 스타일시트에 포함된 각 규칙들의 상세 내용을 알아본다.
    -->

    <style id="styleElement">
        body { background-color: #fff; margin:20px;}        /*css 규칙*/
        p{line-height:1.4em; color:blue}                    /*css 규칙*/
    </style>

    <script>
        var sSheet = document.querySelector('#styleElement').sheet;

        console.log(sSheet.cssRules[0].cssText);        // "body { backgroun-color: red; margin: 20px; }" 이 출력됨.
        console.log(sSheet.cssRules[1].cssText);        // "p { line-height: 1.4em; color: blue; }" 이 출력됨
    </script>
</body>
</html>
