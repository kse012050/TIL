<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>9.11 .disabled속성을 사용하여 스타일시트를 사용 가능/불가능하게함</title>
</head>
<body>
    <!--
    CSSStylesheet 개체의 .disabled 속성을 사용하면 스타일시트를 사용 가능하게 하거나 사용 불가능하게 할 수 있다.
       
    다음 코드에서는 문서 내에서 각 스타일시트의 현재 disabled 값에 접근하고, .disabled 속성을 활용하여 각 스타일시트를 사용 불가능하게 만든다.
    -->
    <link id="linkElement" href="http://yui.yahooapis.com/3.3.0/build/cssreset/reset-min.css" rel="stylesheet" type="text/css"/>

    <style id="styleElement">
        body{color:red;}
    </style>

    <script>
        // 현재 disabled 값(boolean)을 가져옴
        console.log(document.querySelector('#linkElement').disabled);       // 'false'가 출려됨
        console.log(document.querySelector('#styleElement').disabled);       // 'false'가 출려됨

        // 문서 내의 모든 스타일을 사용 불가능하게 하도록 disabled 값을 설정
        document.querySelector('#linkElement').disabled = true;
        document.querySelector('#styleElement').disabled = true;

        /*
        사양상 Disabled는 <link>나 <style> element에는 존재하지 않는 attribute이다.
        오늘날의 최신 브라우저 대다수에서는 HTML 문서 내에 이를 attribute로 추가하려고 시도하면 실패하게 된다(스ㅏ일이 무시되는 위치에서 파싱 오류가 발생할 가능성이 높다.)
        */
    </script>
</body>
</html>
