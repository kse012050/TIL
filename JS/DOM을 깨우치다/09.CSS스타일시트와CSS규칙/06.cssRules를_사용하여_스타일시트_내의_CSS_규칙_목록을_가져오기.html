<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>9.6 cssRules를 사용하여 스타일시트 내의 CSS 규칙 목록을 가져오기</title>
</head>
<body>
    <!--
    이전에 논의했듯이, styleSheets 리스트는 문서 내에 포함된 스타일시트 리스트를 제공한다. cssRules 리스트는 특정 스타일시트 내에 있는 모든 CSS규칙(CSSStyleRule 개체)
    들의 리스트(cssRuleList)를 제공한다.

    다음 코드는 콘솔에 cssRules 리스트를 출력한다.
    -->

    <style id="styleElement">
        body { background-color: #fff; margin:20px;}
        p{line-height:1.4em; color:blue;}
    </style>

    <script>
        var sSheet = document.querySelector('#styleElement').sheet;

        // 스타일시트 내의 각 CSS 규칙을 표현하는 CSSRule 개체들을 모두 가지고 있는 유사 배열 리스트
        console.log(sSheet.cssRules);

        console.log(sSheet.cssRules.length);        // 2가 출력됨

        //CSSRules 리스트 내의 규칙들은 인덱스 0부터 시작
        console.log(sSheet.cssRules[0]);        // 첫 번째 규칙을 출력
        console.log(sSheet.cssRules[1]);        // 두 번째 규칙을 출력
    </script>
</body>
</html>
