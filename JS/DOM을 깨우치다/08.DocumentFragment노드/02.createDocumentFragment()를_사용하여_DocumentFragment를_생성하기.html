<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>8.2 createDocumentFragment()를 사용하여 DocumentFragment를 생성하기</title>
</head>
<body>
    <!--
    다음코드에서는 createDocumentFragment()를 사용하여 DocumentFragment를 생성하고, 해당 fragment에 <li> 를 추가한다.
    -->

    <script>
        var docFrag = document.createDocumentFragment();

        ["blue", "green", "red", "blue", "pink"].forEach(function (e) {
            var li = document.createElement("li");
            li.textContent = e;
            docFrag.appendChild(li);
        });

        // forEach 메서드는 배열의 각 요소에 대해 한 번 제공된 함수를 차례로 호출합니다.
        // https://www.w3schools.com/jsref/jsref_forEach.asp

        console.log(docFrag.textContent);

        /*
        DocumentFragment를 사용하여 메모리상에서 노드 구조를 만들고 이를 라이브 노드 구조에 삽입하면 매우 효율적이다.

        DocumentFragment를 사용하는 것이 단순히 메모리상에서 <div> 를 생성(createElement()사용)하고 <div> 내부에서 작업하여 DOM 구조를
        생성하는 것에 비해 가지는 이점이 무엇인지가 궁금할 것이다. 둘의 차이점은 다음과 같다
            1. DocumentFragment는 어떤 종류의 노드(<body>나 <html>은 제외)도 가질 수 있는 반면, element는 그렇지 않다
            2. DocumentFragment를 DOM에 추가하더라도 DocumentFragment 자체는 추가되지 않으며, 노드의 내용만이 추가된다.
               element를 추가할 경우에는 element자체도 추가 동작에 속하게 된다.
            3. DocumentFragment를 DOM에 추가할 때, DocumentFragment 자체는 추가되는 위치로 이전되며, 생성한 메모리상의 위치에 더 이상 존재하지 않는다.
               노드를 포함하기 위해 일시적으로 사용된 후 하이브 DOM으로 이동되는 element노드는 그렇지 않다.

        말이 너무 어렵다
        */
    </script>
</body>
</html>
