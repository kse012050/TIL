<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>10.2 기본적으로 JavaScript는 동기 방식으로 해석됨</title>
</head>
<body>
    <!--
    기본적으로 DOM이 해석될 때 <script> element를 만나게 되면, 문서 해석을 중지하고 랜더링 및 다운로드를 차단한 후, JavaScript를 실행한다.
    이 동작은 블로킹을 발생시키며, DOM 해석이나 JavaScript 실행을 병렬적으로 수행할 수 없게 하므로, 동기 방식이라고 생각하면된다.
    JavaScript가 HTML 문서 외부에 있는 경우 블로킹이 더 심해지는데, JavaScript를 해석하기 전에 먼저 다운로드해야 하기 때문이다.

    다음의 예제 코드에서는 브루아저가 랜더링하는 동안 DOM에서 여러 <script> element를 만나게 되면 어떤일이 벌어지는지에 대해 주석을 달아 놓았다.
    -->

    <!-- 문서 해ㅓㄱ을 주이 및 차단하고, js를 로드해서 실행한 후 , 문서 해ㅓㄱ을 재개한다 -->
    <script src="http://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.3.3/underscore-min.js">

    </script>

    <!-- 문서 해석을 중지 및 차단하고, js를 로드해서 실행한 후, 문서 해석을 재개한다. -->
    <script>console.log('hi');</script>

    <!-- 로딩 단계와 관련하여 인라인 스크립트오 ㅏ외부 스크립트 간의 차이점에 유의해야 한다.-->

    <!-- <script> element의 기본 블로킹 특성은 성능 및 HTML 웹 페이지의 시각적인 렌더링 속도에 상당한 영향을 미칠수 있다.
        HTML 페이지의 시작 부분에 여러 script element가 있는 경우, 각 스크립트가 순차적으로 다운로드 되어 실행될 때까지는 아무런 다른 동작(예:DOM 해석, 리소스 로딩)이 발생하지 않는다.
        -->
</body>
</html>
