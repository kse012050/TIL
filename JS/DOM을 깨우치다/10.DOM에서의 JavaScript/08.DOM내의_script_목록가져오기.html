<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>10.8 DOM내의 script 목록 가져오기</title>
</head>
<body>
    <!--
    document 개체의 documentscripts 속성은 현재 DOM 내의 모든 script의 리스트를 제공한다.

        다음 코드에서는 이 속성을 활용하여 각 <script> element 의 scr attribute에 접근한다
        -->

    <script src="http://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.3.3/underscore-min.js"></script>
    <script src="http://cdnjs.cloudflare.com/ajax/libs/jquery/1.7.2/jquery.min.js"></script>
    <script src="http://cdnjs.cloudflare.com/ajax/libs/jquery-mousewheel/3.0.6/jquery.mousewheel.min.js"></script>

    <script>
        Array.prototype.slice.call(document.scripts).forEach(function (elm) {
            console.log(elm);
        });     // 문서 내의 각 script element를 출력한다.
    </script>
</body>
</html>
