<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>10.4 async를 사용하여 외부 JavaScript 다운로드 및 실행을 비동기로 수행하기</title>
</head>
<body>
    <!--
     <script> element는 웹 브라우저가 DOM을 생성할 때 <script> element의 순차적인 블로킹 특성을 재정의하기 위한 async라는 attribute를 가지고 있다.
     이 attribute를 사용함으로써 브라우저에 HTML 페이지의 생성(즉 이미지, 스타일시트와 같은 다른 항목의 다운로드를 포함한 DOM 해석)을 차단하지 않아야 하며,
     순차적 로딩 역시 하지 말라고 알려주는 것이다.

    async attribute를 사용하면, 파일들이 병렬적으로 로드되며 다운로드가 끝난 순서대로 해석된다.

     다음 코드에서는 웹 브라우저에서 HTML 문서를 해석하고 랜더링 할 때 무슨 일이 일어난느지에 대해 주석을 달았다
     -->
    <!-- 차단하지 않고, 다운로드를 시작한 후 완료되면 파일을 해석한다.-->
    <script anync src="http://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.3.3/underscore-min.js"></script>

    <!-- 차단하지 않고, 다운로드를 시작한 후 완료되면 파일을 해석한다.-->
    <script anync src="http://cdnjs.cloudflare.com/ajax/libs/jquery/1.7.2/jquery.min.js"></script>

    <!-- 차단하지 않고, 다운로드를 시작한 후 완료되면 파일을 해석한다.-->
    <script defer src="http://cdnjs.cloudflare.com/ajax/libs/jquery-mousewheel/3.0.6/jquery.mousewheel.min.js"></script>

    <script>
        // jQuery가 로드되었는지 아닌지를 알 수 없다.
        console.log(window['jQuery'] === undefined);    // true가 출력됨

        // 모든 것이 로드된 후에야 jQuery가 로드되고 해석되었다고 안전하게 결론 내릴 수 있다.
        document.body.onload = function () { console.log(jQuery().jquery) };

        /*
        IE 10은 async를 지원하지만, IE 9에서는 지원되지 않는다.
        async attribute를 사용할 때의 주요 단점은 JavaScript 파일이 DOM에 포함된 순서와 다르게 해석된다는 것이다.
        니는 종속성 관리 문제를 유발한다. async는 Booleen attribute이지만, 값을 가지지 않는다.

        async를사용 시, 지연되는 JavaScript 내에서는 document.write()가 사용되지 않는다고 가정된다.

        <script> element에서 async attribute와 defer가 둘 다 사용된 경우에는 asyns가 우선하게 된다.
        */
    </script>
</body>
</html>
