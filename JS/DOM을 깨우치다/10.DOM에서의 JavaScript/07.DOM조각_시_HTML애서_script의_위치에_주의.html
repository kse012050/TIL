<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>10.7 DOM조각 시 HTML애서 script의 위치에 주의</title>
    <script>
        /* body element가 브라우저에 의해 해석되지도 않았고, DOM에도 존재하지 않아 null이므로 아직 조작할 수 없다. */
        console.log(document.body.innerHTML);       // Uncaught TypeError; cannot read property 'innerHTML' of null이 출력됨
    </script>
</head>

        <script> element는 원래 동기 방식이므로, HTML 문서의 <head> element에 두게 되면 실행되는 JavaScript가 <script>보다 뒤에 있는 DOM의 요소에
        의존적일 경우 타이밍 문제를 방생시킨다.

        다음의 예제 코드에서 볼 수 있듯이 JavaScript가 문서의 시작 부분에서 발행되어 그보다 뒤에 있는 DOM을 조작하면, JavaScript 오류가 발생한다.
        -->

        이 떄문에 많은 개발자들은 모든 <script> element를 </body> 이전에 두려고 시도한다.
        이렇게 하면, <script. 아펭 있는 DOM이 해석되어 스크립트로 조작할 준비가 되었다고 간주할 수 있다. 또한 이 접근 방법은 코드 베이스를 어지럽힐 수 있는

</html>
