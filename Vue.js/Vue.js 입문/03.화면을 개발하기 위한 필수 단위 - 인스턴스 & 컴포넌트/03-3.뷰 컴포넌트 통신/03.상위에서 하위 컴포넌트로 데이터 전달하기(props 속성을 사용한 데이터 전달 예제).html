<!DOCTYPE html>
<html lang="ko" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>props 속성을 사용한 데이터 전달 예제</title>
  </head>
  <body>
    <div id="app">
      <!-- 팁 : 오른쪽에서 왼쪽으로 속성을 읽으면 더 수월합니다. -->
      <!-- 1 --> <child-component v-bind:propsdata="message"></child-component>
                          <!-- propsdata       / message -->
                          <!-- props 속성 이름 / 상위 컴포넌트의 데이터 속성 -->
    </div>
      <script src="https://unpkg.com/vue@2.6.10/dist/vue.js"></script>
      <script>
        /* 2 */  Vue.component('child-component' , {
          /* 3 */  props: ['propsdata'],
          /* 5 */  template: '<p>{{ propsdata }}</p>'
      })
        /* 4 */ new Vue({
          el: '#app',
          data: {
            message: 'Hello Vue! passed from Parent Component'
          }
        });
      </script>
  </body>
</html>
