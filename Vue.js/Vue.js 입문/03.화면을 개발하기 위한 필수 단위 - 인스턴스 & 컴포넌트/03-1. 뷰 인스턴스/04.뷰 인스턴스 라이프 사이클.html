<!DOCTYPE html>
<html lang="ko" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>라이프 사이클 실습 예제</title>
  </head>
  <body>
    <div id="app">
      {{ message }}
    </div>
      <script src="https://unpkg.com/vue@2.6.10/dist/vue.js"></script>
      <script>
        new Vue({
          el: '#app',
          data:{
            message: 'Hello Vue.js!'
          },
          beforeCreate: function(){
            console.log("beforeCreate");
          },
          created: function(){
            console.log("created");
          },
          mounted: function(){
            console.log("mounted");
          },
          updated: function(){
            console.log("updated");
          }
        });
      </script>
  </body>
</html>
