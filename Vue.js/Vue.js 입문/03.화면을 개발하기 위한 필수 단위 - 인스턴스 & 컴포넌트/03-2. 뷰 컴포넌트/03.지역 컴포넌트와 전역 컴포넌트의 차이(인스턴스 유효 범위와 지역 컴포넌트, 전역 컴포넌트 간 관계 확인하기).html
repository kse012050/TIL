<!DOCTYPE html>
<html lang="ko" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>인스턴스 유효 범위와 지역 컴포넌트, 전역 컴포넌트 간 관계 확인하기</title>
  </head>
  <body>
    <div id="app">
      <h3>첫 번째 인스턴스 영역</h3>
      <my-global-component></my-global-component>  <!-- 전역 컴포넌트 표시-->
      <my-local-component></my-local-component>  <!-- 지역 컴포넌트 표시-->
    </div>
    <hr />
      <div id="app2">
        <h3>두 번째 인스턴스 영역</h3>
        <my-global-component></my-global-component>  <!-- 전역 컴포넌트 표시-->
        <my-local-component></my-local-component>  <!-- 지역 컴포넌트 표시-->
      </div>

      <script src="https://unpkg.com/vue@2.6.10/dist/vue.js"></script>
      <script>
        // 전역 컴포넌트 등록
        Vue.component('my-global-component' , {
            template: '<div>전역 컴포넌트입니다</div>'
        });
        // 지역 컴포넌트 내용
        var cmp = {
          template : '<div>지역 컴포넌트입니다</div>'
        };

        new Vue({
          el: '#app',
          // 지역 컴포넌트 등록
          components: {
            'my-local-component' : cmp
          }
        });
        // 두 번째 인스턴스
        new Vue({
          el: '#app2'
        });
      </script>
  </body>
</html>
