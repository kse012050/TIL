<!DOCTYPE html>
<html lang="ko" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Hello Vue.js 출력하기</title>
  </head>
  <body>
    <div id="app">
      {{ message }}
    </div>
      <script src="https://unpkg.com/vue@2.6.10/dist/vue.js"></script>
      <script>
        new Vue({
          el: '#app',
          data:{
            message: 'Hello Vue.js!'
          }
        });
      </script>
  </body>
</html>
