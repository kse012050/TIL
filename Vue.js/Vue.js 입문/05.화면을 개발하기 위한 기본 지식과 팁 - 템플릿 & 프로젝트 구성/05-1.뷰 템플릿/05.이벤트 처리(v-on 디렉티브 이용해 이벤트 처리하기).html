<!DOCTYPE html>
<html lang="ko" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>v-on 디렉티브 이용해 이벤트 처리하기</title>
  </head>
  <body>
    <div id="app">
      <button v-on:click="clickBtn">클릭</button>
    </div>

      <script src="https://unpkg.com/vue@2.6.10/dist/vue.js"></script>
      <script>
      new Vue({
        el: '#app',
        methods: {
          clickBtn: function() {
            alert('clicked');
          }
        }
      });
      </script>
  </body>
</html>
