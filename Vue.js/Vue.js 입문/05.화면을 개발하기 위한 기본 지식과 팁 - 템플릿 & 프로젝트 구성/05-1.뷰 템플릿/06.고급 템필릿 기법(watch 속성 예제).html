<!DOCTYPE html>
<html lang="ko" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>watch 속성 예제</title>
  </head>
  <body>
    <div id="app">
      <input v-model="message" />
    </div>
      <script src="https://unpkg.com/vue@2.6.10/dist/vue.js"></script>
      <script>
      new Vue({
        el: '#app',
        data: {
          message: 'Hello Vue.js!'
        },
        watch: {
          message: function(data) {
            console.log("message의 값이 바뀝니다 : ", data);
          }
        }
      });
      </script>
  </body>
</html>
