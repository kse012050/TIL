<!DOCTYPE html>
<html lang="ko" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>뷰 리소스로 데이터 받아오기</title>
  </head>
  <body>
    <div id="app">
      <!-- 1. --> <button v-on:click="getData">프레임워크 목록 가져오기</button>
    </div>
      <script src="https://unpkg.com/vue@2.6.10/dist/vue.js"></script>
      <!-- 뷰 리소스 CDN -->
      <script src="https://cdn.jsdelivr.net/npm/vue-resource@1.3.4"></script>
      <script>
        new Vue({
          el: '#app',
          methods: {
            getData: function(){
              /* 2. */ this.$http.get('https://raw.githubusercontent.com/joshua1988/doit-vuejs/master/data/demo.json')
              .then(function(response) {
                /* 3. */ console.log(response);
                console.log(JSON.parse(response.data));
              });
            }
          }
        });
      </script>


      <!-- 뷰 리소스 CDN을 최신으로 했을 때 에러가 난다. 왜그런지는 아직 모르겠다. -->
  </body>
</html>
