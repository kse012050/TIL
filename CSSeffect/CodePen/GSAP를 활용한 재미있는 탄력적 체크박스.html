<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap");
        html,
        body {
            height: 100%;
        }

        body {
            align-items: center;
            background-color: #3d3e4a;
            color: #fff;
            display: flex;
            justify-content: center;
        }

        label {
            align-items: center;
            cursor: pointer;
            display: flex;
            font-family: "IBM Plex Mono", monospace;
            font-weight: 400;
            font-size: 24px;
            padding-right: 15px;
            position: relative;

            span {
                margin-left: 5px;
                transition: text-shadow 1000ms ease, color 1000ms ease;
            }
        }

        input[type="checkbox"] {
            opacity: 0;
            position: absolute;

            &:checked + label span {
                color: #fcdcf3;
            }
        }

        input[type="checkbox"]:focus-visible + label {
            outline: 2px solid #faed76;
            border-radius: 6px;
        }

        path {
            &.unchecked {
                stroke: #252630;
            }

            &.blue {
                mix-blend-mode: color-dodge;
                stroke: #05ddfa;
                transform: translateY(2px);
                transform-box: fill-box;
                transform-origin: center;
                will-change: stroke-dashoffset;
            }

            &.pink {
                stroke: #fc51c9;
                will-change: stroke-dashoffset;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/EasePack.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="checkbox-btn-group">
            <input type="checkbox" value="1" id="option-1" />
            <label for="option-1">
            <svg width="60" height="60">
                <defs>
                <filter id="pink-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feDropShadow dx="2" dy="2" stdDeviation="6" flood-color="#e707f7" flood-opacity="1" />
                </filter>
                </defs>
                <path class="unchecked" d="M18 30 L27 39 L44 22" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                <g class="checked">
                <path class="pink" d="M18 30 L27 39 L44 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#pink-shadow)" />
                <path class="blue" d="M18 30 L27 39 L44 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                </g>
            </svg>
            <span>Option one</span>
            </label>
        </div>

        <div class="checkbox-btn-group">
            <input type="checkbox" value="2" id="option-2" />
            <label for="option-2">
            <svg width="60" height="60">
                <path class="unchecked" d="M18 30 L27 39 L44 22" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                <g class="checked">
                <path class="pink" d="M18 30 L27 39 L44 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#pink-shadow)" />
                <path class="blue" d="M18 30 L27 39 L44 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                </g>
            </svg>
            <span>Option two</span>
            </label>
        </div>

        <div class="checkbox-btn-group">
            <input type="checkbox" value="3" id="option-3" />
            <label for="option-3">
            <svg width="60" height="60">
                <path class="unchecked" d="M18 30 L27 39 L44 22" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                <g class="checked">
                <path class="pink" d="M18 30 L27 39 L44 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#pink-shadow)" />
                <path class="blue" d="M18 30 L27 39 L44 22" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                </g>
            </svg>
            <span>Option three</span>
            </label>
        </div>
    </div>
    <script>
        class CheckboxEffect {
            constructor(groups) {
                this.setStroke();

                groups.forEach((group) => {
                const checkbox = gsap.utils.selector(group)("input[type='checkbox']")[0];

                checkbox.addEventListener("change", () => {
                    const nodes = this.getNodes(checkbox);
                    this.changeEffect(nodes, checkbox.checked);
                });
                });
            }

            setStroke() {
                document
                .querySelectorAll(".checkbox-btn-group g.checked path")
                .forEach((path) => {
                    const length = path.getTotalLength();
                    path.style.strokeDasharray = length;
                    path.style.strokeDashoffset = length;
                });
            }

            getNodes(input) {
                const container = input.closest(".checkbox-btn-group");
                return [
                gsap.utils.selector(container)("path.blue")[0],
                gsap.utils.selector(container)("path.pink")[0]
                ];
            }

            changeEffect(nodes, isChecked) {
                const blueCircle = nodes[0];
                const pinkCircle = nodes[1];
                const length = blueCircle.getTotalLength();

                const isMobile = /Mobi|Android/i.test(navigator.userAgent);
                const duration = 1.6;

                if (isChecked) {
                gsap.killTweensOf([blueCircle, pinkCircle]);

                gsap.set([blueCircle, pinkCircle], {
                    strokeDasharray: length,
                    strokeDashoffset: length
                });

                const endOffset = length * 0.02;
                const modifiers = isMobile
                    ? { strokeDashoffset: (value) => Math.abs(parseFloat(value)) }
                    : undefined;

                gsap.to(pinkCircle, {
                    strokeDashoffset: endOffset,
                    duration: duration,
                    ease: "elastic.out(1.4, 0.2)",
                    delay: 0.035,
                    modifiers
                });

                gsap.to(blueCircle, {
                    strokeDashoffset: endOffset,
                    duration: duration,
                    ease: "elastic.out(1.4, 0.2)",
                    modifiers
                });
                } else {
                gsap.killTweensOf([blueCircle, pinkCircle]);

                gsap.to([blueCircle, pinkCircle], {
                    strokeDasharray: length,
                    strokeDashoffset: length,
                    duration: 0.2,
                    ease: "power2.inOut"
                });
                }
            }
            }

            document.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(EasePack);
            const groups = document.querySelectorAll(".checkbox-btn-group");
            new CheckboxEffect(groups);
            });

    </script>
</body>
</html>
