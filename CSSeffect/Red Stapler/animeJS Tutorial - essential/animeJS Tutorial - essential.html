    <script src="anime.min.js"></script>
    <script>
        // .square01
        anime({
            // 객체 잡기
            targets: '.square01',
            // 객체의 변화하는 속성값
            translateX: 250,
            rotateZ: 360,
            scale: 3,
            // 객체가 변화하는 시간
            duration : 3000,
            // 루프
            loop: true
        });

        // #demo-input
        anime({
            // 객체 잡기
            targets : '#demo-input',
            // value [A , B]  A 부터 B 까지
            value: [0, 100],
            duration:5000,
            // 자릿수?
            round:1,
            // animate CSS 와 동일?
            easing: 'linear',
            direction:'alternate',
            loop: true
        })

        // .square02
        anime({
            // 객체 잡기
            targets: '.square02',
            keyframes:[
                {translateX : 250, scale:1},
                {translateY : 50, scale:1.5},
                {translateX : -250, scale:2},
                {translateY : -50, scale:2.5}
            ],
            // 객체가 변화하는 시간
            duration : 3000,
            // 루프
            loop: true
        });

        // .square03
        anime({
            // 객체 잡기
            targets: '.square03',
            // 상대적인 ?
            translateX: anime.stagger(150),
            delay: anime.stagger(500,{from:'last'}),
            duration : 3000,
            loop: true
        });

        // .square04
        anime({
            // 객체 잡기
            targets: '.square04',
            translateX: anime.stagger(10,{grid:[14,5],from:'center', axis:'x'}),
            translateY: anime.stagger(10,{grid:[14,5],from:'center', axis:'y'}),
            rotateZ: anime.stagger([0,90],{grid:[14,5],from:'center', axis:'x'}),
            delay: anime.stagger(200,{grid:[14,5],from:'center'}),
            duration: 750,
            loop: true,
            direction: 'alternate',
            easing: 'easeInOutQuad',
        });

        // .square05
        anime({
            // 객체 잡기
            targets: '.square05',
            translateX: anime.stagger(20,{grid:[14,5],from:'center', axis:'x'}),
            translateY: anime.stagger(20,{grid:[14,5],from:'center', axis:'y'}),
            rotateZ: anime.stagger([90,180],{grid:[14,5],from:'center', axis:'x'}),
            delay: anime.stagger(200,{grid:[14,5],from:'center'}),
            duration: 750,
            loop: true,
            direction: 'alternate',
            easing: 'easeInOutQuad',
        });
        
    </script>
