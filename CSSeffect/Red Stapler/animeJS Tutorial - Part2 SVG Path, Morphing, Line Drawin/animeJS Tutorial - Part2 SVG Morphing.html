<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anime.js Tutorial - Part2 SVG 모핑</title>
    <style>
        body{width: 100vw; height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background-color: rgb(36,36,36);}

    </style>
</head>
<body>
    <!-- 
        SVG Path Builder
        https://codepen.io/anthonydugois/pen/mewdyZ 
    -->
    <svg id="demo-svg" width="600" height="600">
        <polygon stroke='none' fill='red' points="171 342,293 167,374 248,501 172,559 332,380 549"></polygon>
    </svg>
    <script src="anime.min.js"></script>
    <script>
        anime({
            targets: '#demo-svg polygon',
            points:[
                {value:'171 342,293 167,374 248,501 172,559 332,380 549'},
                {value:'303 283,240 131,412 179,591 120,519 286,421 219'},
            ],
            easing: 'easeOutQuad',
            duration: 2500,
            loop:true,
            direction: 'alternate'
        });
    </script>
</body>
</html>
