<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Pure CSS 3D Cube Effect 5 Minutes Tutorial</title>

    <style>
        .cube-wrapper{width:250px; height:250px; top:50%; left:50%; margin: 100px; box-shadow:10px 10px 51px -7px rgba(0,0,0,0.75); transform:translate(-50%,-50%);}
        .cube, .cube div{width:100%; height:100%; top:0; left:0; position:absolute; transform-style:preserve-3d; transition: transform 0.5s ease-in-out;}
        .cube-front{background-color:red; }
        .cube-top{background-color:blue; transform:translate(0, -100%) rotateX(90deg); transform-origin:bottom;}
        .cube-wrapper:hover .cube{transform:translate(0,50%) rotateX(-90deg); }
    </style>
</head>
<body>
    <div class="cube-wrapper">
        <div class="cube">
            <div class="cube-top"></div>
            <div class="cube-front"></div>
        </div>
    </div>
</body>
</html>
