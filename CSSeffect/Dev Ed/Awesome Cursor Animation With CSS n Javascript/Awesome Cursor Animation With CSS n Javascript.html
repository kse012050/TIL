<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 및 Javascript를 사용한 멋진 커서 애니메이션</title>
    <style>
        .cursor{width: 100px; height: 100px; border: 2px solid black; border-radius: 50%; position: absolute; transform: translate(-50% , -50%); backdrop-filter: grayscale();}
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div>
        <img src="BG.jpg" alt="장나라 이미지">
    </div>

    <script>
        let mouseCursor = document.querySelector(".cursor");
        
        window.addEventListener('mousemove',cursor);
        function cursor(e){
            mouseCursor.style.top = e.pageY + 'px';
            mouseCursor.style.left = e.pageX + 'px';
        }
    </script>
</body>
</html>
