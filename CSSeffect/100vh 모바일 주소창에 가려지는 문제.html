<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100vh 모바일 주소창에 가려지는 문제</title>
  <style>
    body{margin: 0; height: 3000px;}
    div{background: linear-gradient(180deg, rgba(247,247,247,1) 0%, rgba(255,88,0,1) 100%);
      height: 100vh;
      max-height: calc(var(--vh, 1vh) * 100);
      /* max-height에 넣어도 잘 되려나 */
    }
  </style>
</head>
<body>
  <div></div>
  <script>
    let vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty("--vh", `${vh}px`);
  </script>
</body>
</html>
