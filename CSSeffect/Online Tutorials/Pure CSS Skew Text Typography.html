<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Pure CSS Skew Text Typography</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
        }
        .box{
            position: relative;
            left: 0;
            width: 260px;
            height: 600px;
            overflow: hidden;
        }
        .box h2{
            position: absolute;
            top: 50px;
            width: 200%;
            height: 100%;
            display: flex;
            align-items: center;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            font-size: 70px;
            color: #fff;
            text-transform: uppercase;
            transform: skewY(30deg);
        }
        .box-skew{
            position: relative;
            left: 0;
            width: 260px;
            height: 600px;
            overflow: hidden;
        }
        .box-skew h2{
            position: absolute;
            top: 50px;
            left: -260px;
            width: 200%;
            height: 100%;
            display: flex;
            align-items: center;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            font-size: 70px;
            color: #9e9e9e;
            text-transform: uppercase;
            transform: skewY(-30deg);
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Pure CSS Skew Text Typography</h2>
    </div>
    <div class="box-skew">
        <h2>Pure CSS Skew Text Typography</h2>
    </div>
</body>
</html>
