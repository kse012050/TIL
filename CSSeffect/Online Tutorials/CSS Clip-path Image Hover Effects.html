<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CSS Clip-path Image Hover Effects</title>
    <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #111;
    }
    .container{
        position: relative;
        width: 600px;
        height: 400px;
        border: 4px solid #fff;
    }
    .container .box{
        position: absolute;
        width: 100%;
        height: 100%;
    }
    .container .box:nth-child(1){
        background: url(https://img2.daumcdn.net/thumb/R430x0.q70/?fname=https://t1.daumcdn.net/news/201808/13/iMBC/20180813162306998klwc.jpg);
    }
    .container .box:nth-child(2){
        background: url(https://img.hankyung.com/photo/201910/01.20626868.1.jpg);
        z-index: 2;
        transition: 0.5s;
        clip-path: polygon(0 0, 100% 0, 100% 0, 0% 100%);
    }
    .container .box:nth-child(2):hover{
        clip-path: polygon(0 0, 100% 0%, 100% 100%, 0% 100%);
    }

    .container .box:nth-child(1):hover ~ .box:nth-child(2){
        clip-path: polygon(0 0, 100% 0, 100% 0,0 0);
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
