<!DOCTYPE html>
<html lang="kr">
    <head>
        <title>CSS와 HTML이 포함된 다이아몬드 그리드</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
        body{
            margin: 0;
            padding: 0;
        }
        ul{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
            padding: 0;
            width: 600px;
            height: 150px;
        }
        ul li{
            list-style: none;
            position: absolute;
            width: 200px;
            height: 200px;
            background: #000;
            margin: -100px;
            transform: rotate(45deg);
            transition: .5s;
        }
        ul li.item1{
            top: 0;
            left: 0;
        }
        ul li.item2{
            bottom: 0;
            left: 25%;
        }
        ul li.item3{
            top: 0;
            left: 50%;
        }
        ul li.item4{
            bottom: 0;
            left: 75%;
        }
        ul li.item5{
            top: 0;
            left: 100%;
        }
        </style>
    </head>
    <body>
        <ul>
            <li class="item1"><div class="bg"></div></li>
            <li class="item2"><div class="bg"></div></li>
            <li class="item3"><div class="bg"></div></li>
            <li class="item4"><div class="bg"></div></li>
            <li class="item5"><div class="bg"></div></li>
        </ul>
    </body>
</html>
