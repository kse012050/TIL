<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeJS 텍스트 애니메이션 효과를 만드는 방법 | Anime.js</title>
    <style>
        *{margin: 0; padding: 0;}
        section{
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0e1623;
            overflow: hidden;
        }
        section .text{
            position: relative;
            font-size: 5em;
            text-align: center;
            color: #00fe77;
            -webkit-box-reflect:below -0.46em linear-gradient(transparent,#0004);
        }
        section .text span{
            position: relative;
            display: inline-block;
        }
    </style>
</head>
<body>
    <section>
        <h2 class="text">AnimeJS Text Animation Effects</h2>
    </section>
    <script src="anime.min.js"></script>
    <script>
        // now, split text into words
        const text = document.querySelector('.text');
        text.innerHTML = text.textContent.replace(/\S/g, "<span>$&</span>")

        anime.timeline({
            loop: true
        })

        .add({
            targets: '.text span',
            // translateY: [start value, end Value],
            translateY: [-600, 0 ], // [start value, end Value]
            scale: [10,1], // [start value, end Value]
            opacity: [0,1], // [start value, end Value]
            easing: "easeOutExpo",
            duration: 1500, // 1.5 seconds
            delay : anime.stagger(100),
        })
        .add({
            targets: '.text span',
            // translateY: [start value, end Value],
            translateX: [0, -1000 ], // [start value, end Value]
            scale: [1,1], // [start value, end Value]
            opacity: [1,0], // [start value, end Value]
            easing: "easeOutExpo",
            duration: 2000, // 1.5 seconds
            delay : anime.stagger(100),
        })
        .add({
            targets: '.text span',
            // translateY: [start value, end Value],
            translateX: [1000, 0 ], // [start value, end Value]
            scale: [1,1], // [start value, end Value]
            opacity: [0,1], // [start value, end Value]
            easing: "easeOutExpo",
            duration: 1500, // 1.5 seconds
            delay : anime.stagger(100),
        })
        .add({
            targets: '.text span',
            // translateY: [start value, end Value],
            translateX: [0, 0 ], // [start value, end Value]
            scale: [1,50], // [start value, end Value]
            opacity: [1,0], // [start value, end Value]
            easing: "easeOutExpo",
            duration: 1500, // 1.5 seconds
            delay : anime.stagger(100),
        })
    </script>
</body>
</html>
