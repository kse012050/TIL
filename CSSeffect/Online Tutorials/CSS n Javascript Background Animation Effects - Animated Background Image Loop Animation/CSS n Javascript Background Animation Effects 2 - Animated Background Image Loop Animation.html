<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 및 자바스크립트 배경 애니메이션 효과 2 | 애니메이션 배경 이미지 루프 애니메이션</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        body{
            background: #710c19;
        }
        section{
            position: relative;
            width: 100%;
            height: 100vh;
            transform-style: preserve-3d;
            perspective: 500px;
        }
        section h2{
            position: relative;
            width: 100%;
            height: 100vh;
            text-align: center;
            line-height: 100vh;
            font-size: 10vw;
            color: #fff;
            font-weight: 700;
        }
        .banner{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
        }
        .banner .blocks{
            position: relative;
            display: block;
            width: 5vw;
            height: 5vw;
            animation: animate 2s ease-in-out forwards;
            animation-delay: 1s;
        }
        @keyframes animate {
            0%{
                transform: translateZ(2000px);
                background: url(img.jpg);
                background-size: cover;
                background-attachment: fixed;
                box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            }
            100%{
                transform: translateZ(0px);
                background: url(img.jpg);
                background-size: cover;
                background-attachment: fixed;
                border: 1px solid rgba(0,0,0,0.1);
                box-shadow: 0 5px 15px rgba(0,0,0,0);
            }
        }

        section.active .banner .blocks{
            animation: animateTwo 2s ease-in-out forwards;
            background: url(img.jpg);
            background-size: cover;
            background-attachment: fixed;
            border: 1px solid rgba(0,0,0,0.1);
        }

        @keyframes animateTwo {
            0%{
                transform: translateZ(0px);
                background: url(img.jpg);
                background-size: cover;
                background-attachment: fixed;
                box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            }
            100%{
                transform: translateZ(2000px);
                background: url(img.jpg);
                background-size: cover;
                background-attachment: fixed;
                border: 1px solid rgba(0,0,0,0.1);
                box-shadow: 0 5px 15px rgba(0,0,0,0);
            }
        }
    </style>
</head>
<body>
    <section>
        <h2>JS Animation</h2>
        <div class="banner">
            <div class="blocks"></div>
        </div>
    </section>

    <script>
        const banner = document.getElementsByClassName('banner')[0];
        const blocks = document.getElementsByClassName('blocks');
        for(var i = 0; i < 400; i++){
            banner.innerHTML += '<div class="blocks"></div>';
            const duration = Math.random() * 5;
            blocks[i].style.animationDuration = 2 +  duration + 's';
            blocks[i].style.animationDelay = 2 +  duration + 's';
        }

        const section = document.querySelector('section');
        setTimeout(function(){
            section.classList.add('active')
        },14000)    // add class active after 14seconds
    </script>
</body>
</html>
