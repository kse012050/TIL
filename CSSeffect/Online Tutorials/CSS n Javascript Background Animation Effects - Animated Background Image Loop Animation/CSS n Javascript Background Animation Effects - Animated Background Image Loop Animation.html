<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS & Javascript 배경 애니메이션 효과 | 내이메이션 배경 이미지 루프 애니메이션</title>
    <style>
        *{margin: 0; padding: 0;}
        section{
            position: relative;
            width: 100%;
            height: 100vh;
            background: #333;
        }
        section h2{
            position: relative;
            width: 100%;
            height: 100vh;
            text-align: center;
            line-height: 100vh;
            font-size: 10vw;
            color: #fff;
            font-weight: 700;
        }
        .banner{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
        }
        .banner .blocks{
            position: relative;
            display: block;
            width: 5vw;
            height: 5vh;
            animation: animate 0.75s ease-in-out forwards;
        }
        .banner .blocks:nth-child(even){
            animation: animate 1s ease-in-out forwards;
        }
        .banner .blocks:nth-child(7n + 3){
            animation: animate 2.5s ease-in-out forwards;
        }
        .banner .blocks:nth-child(7n + 7){
            animation: animate 1.5s ease-in-out forwards;
        }
        @keyframes animate {
            0%{
                opacity: 0;
                transform: scale(0) translateY(1000px);
            }
            50%{
                opacity: 1;
                background: url(img.jpg);
                background-position: center;
                background-size: cover;
                background-attachment: fixed;
            }
            100%{
                opacity: 1;
                transform: scale(1) translateY(0px);
                background: url(img.jpg);
                background-position: center;
                background-size: cover;
                background-attachment: fixed;
            }
        }
    </style>
</head>
<body>
    <section>
        <h2>JS Animation</h2>
        <div class="banner">
            <div class="blocks"></div>
        </div>
    </section>
    <script>
        const banner = document.getElementsByClassName('banner')[0];
        const blocks = document.getElementsByClassName('blocks');

        for (var i = 1; i < 400; i++){
            banner.innerHTML += '<div class="blocks"></div>';
            blocks[i].style.animationDelay = `${i * 0.05}s`;
        }
    </script>
</body>
</html>
