<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트를 이용한 자기 마우스 이동 효과</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap');
        *{margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif;}
        body{display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #333;}
        .container{display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 100px;}
        .card{position: relative; width: 200px; height: 200px; background: var(--clr); display: flex; justify-content: center; align-items: center; font-size: 5em; color: rgba(0, 0, 0, 0.25); font-weight: 600; cursor: pointer; transition: 0.1s;}
    </style>
</head>
<body>
    <div class="container">
        <div class="card" style="--clr: #ff6464">01</div>
        <div class="card" style="--clr: #64c0ff">02</div>
        <div class="card" style="--clr: #48e365">03</div>
        <div class="card" style="--clr: #cb4af7">04</div>
    </div>
    <script>
        let card = document.querySelectorAll('.card').forEach(cards => {
            cards.addEventListener('mousemove', (e)=> {
                let x = e.offsetX;
                let y = e.offsetY;
                let cardWidth = cards.clientWidth;
                let cardHeight = cards.clientHeight;
                let posX = (x - cardWidth / 2)
                let posY = (y - cardHeight / 2)
                cards.style.transform = `translateX(${posX}px) translateY(${posY}px)`
            })
            cards.addEventListener('mouseout', (e)=> {   
                cards.style.transform = ``
            })
        })
    </script>
</body>
</html>
