<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Scrolling Banner Text Animation Effects Using Html & CSS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      *{
        margin:0;
        padding: 0;
      }
      section{
        position:relative;
        width: 100%;
        height: 100vh;
        display: flex;
        overflow: hidden;
      }
      section div{
        position: relative;
        width: 50%;
        background: #20506b;
        overflow: hidden;
      }
      section div:nth-child(1){
        position: relative;
        width: 50%;
        background: url(https://pbs.twimg.com/media/D0R7GCPUUAIhOTR.jpg);
        /* background-size: cover; */
        overflow: hidden;
      }
      section div:nth-child(1) h2{ 
        -webkit-text-stroke: 2px;
        -webkit-text-stroke-color: #fff;
        -webkit-text-fill-color: transparent;
        left: 100%;
      }
      section div h2{
        position: absolute;
        white-space: nowrap;
        font-size: 12em;
        line-height: 100vh;
        color: #fff;
        animation: animate 60s linear infinite;
      }
      @keyframes animate{
        0%{
          transform: translateX(0);
        }
        100%{
          transform: translateX(-100%);
        }
      }
    </style>
</head>
    <body>
      <section>
        <div>
          <h2>
            Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua
          </h2>
        </div>
        <div>
          <h2>
            Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua
          </h2>
        </div>
      </section>
    </body>
</html>
