<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 전용 추상적인 배경 디자인 | HTML CSS</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        section{position: relative; width: 100%; height: 100vh; background: #222; overflow: hidden;}
        section .layer{position: absolute; top: 0; left: -50%; width: 100%; height: 100%; box-shadow: 10px 0 10px rgba(0, 0, 0, 0.25);}
        section .layer.layer1{background: #03a9f4; transform: skewX(-45deg) translateX(0); z-index: 1;}
        section .layer.layer2{background: #fff; transform: skewX(-45deg) translateX(-100px); z-index: 3;}
        section .layer.layer3{background: #ff3161; transform: skewX(-45deg) translateX(-200px); z-index: 5;}
        section .layer.layer4{background: #222; transform: skewX(-45deg) translateX(-300px); z-index: 10;}
        section .layer.layer5{background: #ff3161; transform: skewX(45deg) translateX(0px); z-index: 2;}
        section .layer.layer6{background: #03a9f4; transform: skewX(45deg) translateX(-100px); z-index: 4;}
        section .layer.layer7{background: #fff; transform: skewX(45deg) translateX(-200px); z-index: 6;}
        section .layer.layer8{background: #222; transform: skewX(45deg) translateX(-300px); z-index: 8;}
        section .layer.layer9{background: transparent; transform: skewX(45deg) translateX(-300px); z-index: 10;}
    </style>
</head>
<body>
    <section>
        <div class="layer layer1"></div>
        <div class="layer layer2"></div>
        <div class="layer layer3"></div>
        <div class="layer layer4"></div>
        <div class="layer layer5"></div>
        <div class="layer layer6"></div>
        <div class="layer layer7"></div>
        <div class="layer layer8"></div>
        <div class="layer layer9"></div>
    </section>
</body>
</html>
