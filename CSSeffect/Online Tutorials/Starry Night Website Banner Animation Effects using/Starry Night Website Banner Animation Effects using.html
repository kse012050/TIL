<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별이 빛나는 밤 웹 사이트 배너 애니메이션 효과</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        .scene{
            position: relative;
            width: 100%;
            height: 100vh;
            background: linear-gradient(#111425,#3751e0);
            background-attachment: fixed;
            overflow: hidden;
        }
        .moon{
            position: relative;
            top: 100px;
            left: 400px;
            width: 100px;
            height: 100px;
            background: #fff;
            border-radius: 50%;
            z-index: 1000;
        }
        .moon::after{
            content: '';
            position: absolute;
            top: -15px;
            left: 15px;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(#111425,#3751e0);
            background-attachment: fixed;
        }
        .forest{
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            transform: scale(1.2);
        }

        .scene i{
            position: absolute;
            background: #fff;
            border-radius:50%;
            animation: animate linear infinite;
        }

        @keyframes animate {
            0%{
                opacity: 0;
                transform: translateY(0);
            }
            10%,90%{
                opacity: 1;
            }
            100%{
                transform: translateY(-100px);
            }
        }

        .cloud1{
            position: absolute;
            top: 0;
            left: 0;
            max-width: 600px;
            z-index: 100000;
            animation: animateCloud 50s linear infinite;
        }
        .cloud2{
            position: absolute;
            top: 0;
            left: 0;
            max-width: 500px;
            z-index: 100000;
            animation: animateCloud 35s linear infinite;
        }
        .cloud3{
            position: absolute;
            top: 0;
            left: 0;
            max-width: 600px;
            z-index: 100000;
            animation: animateCloud 80s linear infinite;
        }
        .cloud4{
            position: absolute;
            top: 200px;
            left: 0;
            max-width: 300px;
            z-index: 100000;
            animation: animateCloud 70s linear infinite;
            animation-delay: -20s;
        }
        .cloud5{
            position: absolute;
            top: 150px;
            left: 0;
            max-width: 500px;
            z-index: 100000;
            animation: animateCloud 40s linear infinite;
            animation-delay: -5s;
        }
        .cloud6{
            position: absolute;
            top: 75px;
            left: 0;
            max-width: 400px;
            z-index: 100000;
            animation: animateCloud 30s linear infinite;
            animation-delay: -10s;
        }
        @keyframes animateCloud {
            0%{
                transform: translateX(-100%) scale(1);
            }
            100%{
                transform: translateX(400%) scale(1.5);
            }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="moon"></div>
        <img src="forest.png" class="forest">
        <img src="cloud1.png" class="cloud1">
        <img src="cloud2.png" class="cloud2">
        <img src="cloud3.png" class="cloud3">
        <img src="cloud1.png" class="cloud4">
        <img src="cloud2.png" class="cloud5">
        <img src="cloud3.png" class="cloud6">
    </div>

    <script>
        function stars(){
            let count = 500;
            let scene = document.querySelector('.scene');
            let i = 0;
            while(i < count){
                let star = document.createElement('i');
                let x = Math.floor(Math.random() * window.innerWidth);
                // Math.floor() 함수는 주어진 숫자와 같거나 작은 정수 중에서 가장 큰 수를 반환합니다.
                // 내림!
                // Math.random() 함수는 0 이상 1 미만의 구간에서 근사적으로 균일한 부동소숫점 의사난수를 반환하며,
                //              이 값은 사용자가 원하는 범위로 변형할 수 있습니다.
                //              난수 생성 알고리즘에 사용되는 초기값은 구현체가 선택하며, 사용자가 선택하거나 초기화할 수 없습니다.

                // Math.random() 은 암호학적으로 안전한 난수르 제공하지 않으므로, 보안과 관련된 어떤 것에도 이 함수를 사용해서는 안됩니다.
                //               그 대신 Web Crypto API의
                //              window.crypto.getRandomValues() (https://developer.mozilla.org/ko/docs/Web/API/Crypto/getRandomValues)                                
                //              메소드를 이용하여야 합니다.
                let y = Math.floor(Math.random() * window.innerHeight);
                let duration = Math.random() * 10;
                let size = Math.random() * 2;

                star.style.left = x + 'px';
                star.style.top = y + 'px';
                star.style.width = 1 + size + 'px';
                star.style.height = 1 + size + 'px';

                star.style.animationDuration = 5 + duration + "s";
                star.style.animationDelay = duration + "s";

                scene.appendChild(star);
                i++;
            }
        }
        stars();
    </script>
</body>
</html>
