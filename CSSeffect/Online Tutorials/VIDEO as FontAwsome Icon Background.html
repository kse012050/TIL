<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>VIDEO as FontAwsome Icon Background</title>
    <!-- VIDEO 파일이 없어서 사진으로 대체 했습니다. -->
    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .banner{
            position: absolute;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .banner img{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .banner i.fa{
            position: relative;
            width: 100%;
            height: 100%;
            background: #fff;
            font-size: 35vw;
            text-align: center;
            color: #000;
            line-height: 100vh;
            mix-blend-mode: screen;
        }

        .banner i.fa:hover{
            color: #fff;
            background-color: #000;
        }

        @media (max-width:768px){
            .banner{
                flex-direction: column;
            }
            .banner i.fa{
                height: 50%;
                line-height: 50vh;
                font-size: 50vw;
            }
        }
    </style>
</head>
<body>
    <div class="banner">
        <img src="https://i.ytimg.com/vi/GeeM2V15QFY/maxresdefault.jpg" alt="">
        <i class="fa fa-facebook" aria-hidden="true"></i>
        <i class="fa fa-twitter" aria-hidden="true"></i>
    </div>
</body>
</html>
