<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 크리에이티브 이미지 호버 효과 | CSS 클립 경로를 사용하여 멋진 효과 만들기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap');
        *{margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand',sans-serif;}
        body{display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #111;}
        .container{position: relative; width: 800px; height: 500px; background: #222;}
        .container .clip{position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: 0.5s; background-repeat: no-repeat; background-size: cover;}
        .container .clip.clip1{background-image: url('1.jpg');  clip-path: polygon(0 0,55% 0, 20% 100%, 0% 100%);}
        .container .clip.clip2{background-image: url('2.jpeg'); clip-path: polygon(55% 0,100% 0, 45% 100%, 20% 100%);}
        .container .clip.clip3{background-image: url('3.jpg'); clip-path: polygon(100% 0,100% 0, 100% 100%, 45% 100%);}
        .container:hover .clip{clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);}
        .container .clip:hover{clip-path: polygon(0 0,100% 0,100% 100%,0% 100%);}
    </style>
</head>
<body>
    <div class="container">
        <div class="clip clip1"></div>
        <div class="clip clip2"></div>
        <div class="clip clip3"></div>
    </div>
</body>
</html>
