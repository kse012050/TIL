<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript 마우스를 올리면 비디오 재생 및 마우스 아웃시 일시 중지 | 비디오 갤러리</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        .container{
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            min-height: 100vh;
        }
        .container .box{
            position: relative;
            width: 50%;
            height: 50vh;
            filter: grayscale(1);
            border: 4px solid #000;
        }
        .container .box:hover{
            filter: grayscale(0);
        }
        .container .box video{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <video src="clip1.mp4" type="video/mp4" loop class="clip" muted></video>
        </div>
        <div class="box">
            <video src="clip2.mp4" type="video/mp4" loop class="clip" muted></video>
        </div>
        <div class="box">
            <video src="clip3.mp4" type="video/mp4" loop class="clip" muted></video>
        </div>
        <div class="box">
            <video src="clip4.mp4" type="video/mp4" loop class="clip" muted></video>
        </div>
    </div>

    <script>
        const clip = document.querySelectorAll('.clip');
        for (let i = 0; i < clip.length; i++){
            clip[i].addEventListener('mouseenter',function(e){
                clip[i].play()
                // video 속성 muted(음소거) 가 걸리지 않으면 에러가 발생한다.
            });
            clip[i].addEventListener('mouseout',function(e){
                clip[i].pause()
            })
        }
    </script>
</body>
</html>
