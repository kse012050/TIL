<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CSS Neumorphism For Beginners</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        section{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eaeaea;
        }
        h2{
            font-size: 10em;
            color: #eaeaea;
            text-shadow:  6px 6px 12px rgba(0,0,0,0.08),
                            -6px 6px 12px rgba(255,255,255,1);
        }
        .box1{
            position: absolute;
            top: 50px;
            right: 300px;
            height: 200px;
            width: 200px;
            background: #eaeaea;
            border-radius: 50%;
            box-shadow:  6px 6px 12px rgba(0,0,0,0.08),
                            -6px 6px 12px rgba(255,255,255,1);
        }
        .box2{
            position: absolute;
            bottom: 50px;
            right: 300px;
            height: 200px;
            width: 200px;
            background: #eaeaea;
            box-shadow:  6px 6px 12px rgba(0,0,0,0.08),
                            -6px 6px 12px rgba(255,255,255,1);
        }
        .box3{
            position: absolute;
            top: 50px;
            left: 300px;
            height: 250px;
            width: 250px;
            background: #eaeaea;
            border-radius: 50%;
            box-shadow:  6px 6px 12px rgba(0,0,0,0.08),
                            -6px 6px 12px rgba(255,255,255,1);
        }
        .box3::before{
            content: '';
            position: absolute;
            top: 50px;
            left: 50px;
            right: 50px;
            bottom: 50px;
            background: #eaeaea;
            border-radius: 50%;
            box-shadow: inset 6px 6px 12px rgba(0,0,0,0.08),
                        inset -6px 6px 12px rgba(255,255,255,1);
        }
        .box4{
            position: absolute;
            bottom: 50px;
            left: 300px;
            height: 250px;
            width: 250px;
            background: #eaeaea;
            border-radius: 50px;
            box-shadow:  6px 6px 12px rgba(0,0,0,0.08),
                            -6px 6px 12px rgba(255,255,255,1);
        }
        .box4::before{
            content: '';
            position: absolute;
            bottom: 50px;
            left: 50px;
            right: 50px;
            top: 50px;
            background: #eaeaea;
            border-radius: 50px;
            box-shadow: inset 6px 6px 12px rgba(0,0,0,0.08),
                        inset -6px 6px 12px rgba(255,255,255,1);
        }
    </style>
</head>
<body>
    <section>
        <h2>Neumorphism For Beginners</h2>
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
    </section>
</body>
</html>
