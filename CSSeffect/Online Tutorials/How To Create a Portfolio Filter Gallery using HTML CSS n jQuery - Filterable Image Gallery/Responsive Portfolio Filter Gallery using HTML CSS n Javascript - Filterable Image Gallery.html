<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML CSS 및 Javascript르르 사용하는 반응형 포트폴리오 필터 갤러리 | 필터링 가능한 이미지 갤러리</title>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <style>
           *{margin: 0; padding: 0; box-sizing: border-box;}
        section{
            padding: 20px;
            width: 1280px;
            margin: 40px auto;
        }
        section ul{
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        section ul li{
            list-style: none;
            background: #eee;
            padding: 8px 20px;
            margin: 5px;
            letter-spacing: 1px;
            cursor: pointer;
              
        }
        section ul li.active{
            background: #03a9f4;
            color: #fff;
        }
        .product{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .product .itemBox{
            position: relative;
            width: 200px;
            height: 200px;
            margin: 5px;
            display: block;
        }
        .product .itemBox img{
            position: absolute;   
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit:cover;
        }
    </style>
</head>
<body>
    <section>
        <ul>
            <li class="list active" data-filter="All">All</li>
            <li class="list" data-filter="IU">IU</li>
            <li class="list" data-filter="Nara">Nara</li>
            <li class="list" data-filter="Okbin">okbin</li>
        </ul>
        <div class="product">
            <div class="itemBox IU"><img src="IU01.jpg" alt=""></div>
            <div class="itemBox Nara"><img src="Nara01.jpg" alt=""></div>
            <div class="itemBox Okbin"><img src="Okbin01.jpg" alt=""></div>
            <div class="itemBox IU"><img src="IU02.jpg" alt=""></div>
            <div class="itemBox Okbin"><img src="Okbin02.jpg" alt=""></div>
            <div class="itemBox Nara"><img src="Nara02.jpg" alt=""></div>
            <div class="itemBox IU"><img src="IU03.jpg" alt=""></div>
            <div class="itemBox IU"><img src="IU04.jpg" alt=""></div>
        </div>
    </section>
    <script>
          $(document).ready(function(){
            $('.list').click(function(){
                const value = $(this).attr('data-filter');
                if(value == 'All'){
                    $('.itemBox').show('1000');
                }else{
                    $('.itemBox').not('.' + value).hide('1000');
                    $('.itemBox').filter('.' + value).show('1000');
                }
            });
            // add active class on selected item
            // 선택한 항목에 활성 클래스 추가

            $('.list').click(function(){
                $(this).addClass('active').siblings().removeClass('active');
            });
        });
    </script>
</body>
</html>
