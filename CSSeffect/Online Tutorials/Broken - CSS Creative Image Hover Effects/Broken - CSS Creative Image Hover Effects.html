<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>깨진 - CSS 크리에이티브 이미지 호버 효과</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        body{display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #222;}
        .box{position: relative; width: 400px; height: 300px; /* background-color: #fff; */}
        .box span{position: absolute; inset: 0; transition: 0.5s; background: url('bg.png'); background-size: cover;}
        .box span:nth-child(1){clip-path: polygon(0 0,50% 0, 50% 50%, 0 50%); /* background-color: #a00; */ transition-delay:0s;}
        .box span:nth-child(2){clip-path: polygon(50% 0,100% 0, 100% 50%, 50% 50%); /* background-color: #0a0; */ transition-delay:0.25s;}
        .box span:nth-child(3){clip-path: polygon(0 50%,50% 50%, 50% 100%, 0% 100%); /* background-color: #00a; */ transition-delay:0.5s;}
        .box span:nth-child(4){clip-path: polygon(50% 50%,100% 50%, 100% 100%, 50% 100%); /* background-color: #aa0; */ transition-delay:0.75s;}

        /* hover effects */
        .box:hover span:nth-child(1){transform: translate(-40px, -60px) rotate(-15deg);}
        .box:hover span:nth-child(2){transform: translate(40px, -100px) rotate(25deg);}
        .box:hover span:nth-child(3){transform: translate(-40px, 80px) rotate(15deg);}
        .box:hover span:nth-child(4){transform: translate(40px, 80px) rotate(-15deg);}
    </style>
</head>
<body>
    <div class="box">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>
</body>
</html>
