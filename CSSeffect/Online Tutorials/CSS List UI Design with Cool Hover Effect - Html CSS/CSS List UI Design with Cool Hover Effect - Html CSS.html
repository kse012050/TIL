<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>멋진 호버 효과가 있는 CSS 목록 UI 디자인 | HTML CSS</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        body{display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fcfcfc;}
        .box{position: relative; min-width: 425px; background: #00bcd4; padding: 20px; box-shadow: 0 35px 50px rgba(0, 0, 0, 0.1);}
        .box::before{content: ''; position: absolute; top: 0; right: 0; width: calc(100% - 75px); height: 100%; background: #fff;}
        .box h3{position: relative; color: #333; font-size: 1.5em; margin-bottom: 20px; padding-left: 70px; }
        .box .list{position: relative; display: flex; align-items: center; padding: 10px; margin: 10px 0; cursor: pointer;}
        .box .list::before{content: ''; position: absolute; width: 100%; height: 100%; background: #00bcd4; transition: transform 0.5s; transform: scaleX(0); transform-origin: right;}
        .box .list:hover::before{transition: transform 0.5s; transform: scaleX(1); transform-origin: left;}
        .box .list .imgBx{position: relative; min-width: 70px; height: 70px; background: #fff; overflow: hidden; border: 6px solid #fff; box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1); margin-right: 20px; margin-left: 10px;}
        .box .list .imgBx img{position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;}
        .box .list .content{position: relative; display: flex; flex-direction: column; justify-content: center; width: 100%; color: #333;}
        .box .list .content .rank{position: absolute; right: 0; font-size: 2em; color: #fff; transform: scale(0); transition: 0.5s;}
        .box .list .content .rank small{font-weight: 500; opacity: 0.25;}
        .box .list:hover .content .rank{transform: scale(1);}
        .box .list .content h4{font-weight: 600; line-height: 1em; text-transform: uppercase; transition:0.5s;}
        .box .list .content p{opacity: 0.85; transition:0.5s;}
        .box .list .content:hover h4 , 
        .box .list .content:hover p{color: #fff;}
    </style>
</head>
<body>
    <section>
        <div class="box">
            <h3>Popular Creator List</h3>
            <div class="list">
                <div class="imgBx">
                    <img src="IU.jpg" alt="">
                </div>
                <div class="content">
                    <h2 class="rank"><small>#</small>1</h2>
                    <h4>IU</h4>
                    <p>가수</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
