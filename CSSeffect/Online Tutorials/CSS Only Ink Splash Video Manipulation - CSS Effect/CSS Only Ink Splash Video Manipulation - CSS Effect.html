<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 전용 잉크 스플래시 비디오 조작 | CSS 효과</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        .container{
            position: relative;
            width: 100%;
            height: 100vh;
        }
        .container video{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .container video:nth-child(2){
            mix-blend-mode: screen;
            filter: brightness(2);
        }
    </style>
</head>
<body>
    <div class="container">
        <video src="clip.mp4" type="video/mp4" autoplay muted></video>
        <video src="ink.mov" type="video/mp4" autoplay muted></video>
    </div>
</body>
</html>
