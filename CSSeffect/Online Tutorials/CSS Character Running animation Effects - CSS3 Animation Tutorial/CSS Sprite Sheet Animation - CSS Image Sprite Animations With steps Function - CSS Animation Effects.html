<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 스프라이트 시트 애니메이션 - CSS 이미지 스프라이트 애니메이션(단계 기능 포함) - CSS 애니메이션 효과</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        .box{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(1536px / 6);
            height: 256px;
            background: url(spritestrip.webp);
            animation: animate 1s steps(6) infinite;
        }

        @keyframes animate {
            from{
                background-position: 0;
            }
            to{
                background-position: -1536px;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
