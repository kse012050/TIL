<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>CSS Text Stroke Fill Hover Effects</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body{
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                font-family: sans-serif;
            }
            h1{
                position: relative;
                margin: 0;
                padding: 0;
                color: #fff;
                -webkit-text-stroke:2px #000;
                font-weight: 1000;
                font-size: 10em;
                text-align: center;
                text-transform: uppercase;
                line-height: 1em;
            }
            h1::before,
            h1::after{
                position: absolute;
                content: attr(data-text);
                top: 0;
                left: 0;
                width: 100%;
                height: 0;
                color: #039af4;
                overflow: hidden;
                transition: 1s;
                transition-delay: 1s;
            }
            h1:hover::before{
                height: 100%;;
                transition-delay: 0s;
            }
            h1::after{
                color: #e91e63;
                height: 0;
                transition-delay: 0s;
            }
            h1:hover::after{
                height: 100%;
                transition-delay: 1s;
            }
        </style>
    </head>
    <body>
        <h1 data-text="CSS Text Stroke Fill Hover Effects">CSS Text Stroke Fill Hover Effects</h1>
    </body>
</html>
