<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 Transform Effects on Scroll 2 </title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            height: 200vh;
            background-color: #fff;
        }
        section{
            position: absolute;
            width: 100%;
            height: 100vh;
            background: url(https://img-s-msn-com.akamaized.net/tenant/amp/entityid/AAK5cOV.img?h=0&w=720&m=6&q=60&u=t&o=f&l=f&x=294&y=214)
                , linear-gradient(230deg, #f533d4, #2461bb);
            background-size: contain;
            background-blend-mode: luminosity;
        }
        section .skewed{
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            transform: skewY(-10deg);
            transform-origin: top left;
        }

    </style>
</head>
<body>
    <section>
        <span class="skewed"></span>
    </section>

    <script>
        var skewed = document.querySelector(".skewed");
        window.addEventListener("scroll",function(){
            var value = -10 + window.scrollY/60;
            skewed.style.transform = "skewY("+value+"deg)";
        });
    </script>
</body>
</html>
