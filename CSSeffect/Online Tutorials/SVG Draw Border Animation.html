<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>SVG Draw Border Animation</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <style>
            body{
                margin: 0;
                padding: 0;
            }
            a{
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%,-50%);
                width: 180px;
                height: 60px;
                text-align: center;
                line-height: 60px;
                font-family: sans-serif;
                text-transform: uppercase;
                font-size: 24px;
                letter-spacing: 2px;
                color: #000;
                text-decoration: none;
                transition: 0.5s;
            }
            a svg, a svg rect{
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                fill: transparent;
            }
            a svg rect{
                stroke: #000;
                stroke-width: 4;
                transition: 1.5s;
                stroke-dasharray: 480;
                stroke-dashoffset: 480;
            }
            a:hover svg rect{
                stroke-dashoffset: 0;
            }
            a:hover{
                background: #ff0;
                transition-delay: 1.5s;
            }
        </style>
    </head>
    <body>
        <a href="#">
            <svg><rect></rect></svg>    
            Button
        </a>
    </body>
</html>
