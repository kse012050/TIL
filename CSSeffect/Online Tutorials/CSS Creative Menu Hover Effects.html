<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CSS Creative Menu Hover Effects</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
        }
         ul{
            position: relative;
            margin: 0;
            padding: 0;
        }
        ul li{
            list-style: none;
            margin: 0;
            font-size: 4em;
        } 
        ul li a{
            position: relative;
            color: #ddd;
            text-decoration: none;
            font-weight: 700;
        }
        ul li a::before{
            content: attr(data-text);
            position: absolute;
            top: 0;
            width: 100%;
            color: #262626;
            overflow: hidden;
            white-space: nowrap;
            transition: 0.5s ease-in-out;
        }
        ul:hover li a::before{
            width: 0;
        }
        ul li:hover a::before{
            width: 100%;
        }
    </style>
</head>
<body>
    <ul>
        <li>
            <a href="#" data-text="HOME">HOME</a>
        </li>
        <li>
            <a href="#" data-text="About">About</a>
        </li>
        <li>
            <a href="#" data-text="Services">Services</a>
        </li>
        <li>
            <a href="#" data-text="Menu">Menu</a>
        </li>
        <li>
            <a href="#" data-text="Our Team">Our Team</a>
        </li>
        <li>
            <a href="#" data-text="Contact Us">Contact Us</a>
        </li>
    </ul>
</body>
</html>
