<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 및 바닐라 자바 스크립트를 사용한 애니메이션 연기 텍스트 | CSS 애니메이션 효과</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        section{
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #111;
            overflow: hidden;
        }
        section .text{
            position: relative;
            color: #fff;
            margin: 40px;
            max-width: 800px;
            user-select: none;
            font-size: 1.5em;
        }
        section .text span{
            position: relative;
            display: flex;
            display: inline-block;
            cursor: pointer;
        }
        section .text span.active{
            animation: smoke 2s linear forwards;
            transform-origin: bottom;
        }
        @keyframes smoke {
            0%{
                opacity: 1;
                filter: blur(0);
                transform: translateX(0) translateY(0) rotate(0deg) scale(1);
            }
            50%{
                opacity: 1;
                pointer-events: none;
            }
            100%{
                opacity: 0;
                filter: blur(20px);
                transform: translateX(300px) translateY(-300px) rotate(720deg) scale(4);
            }
        }
    </style>
</head>
<body>
    <section>
        <p class="text">
            Lorem ipsum, dolor sit amet consectetur adipisicing elit. Corporis hic nobis at inventore tempore totam temporibus, eum quibusdam accusantium iste, ipsum impedit fuga asperiores necessitatibus, suscipit reprehenderit officiis vel quae.
        </p>
    </section>
    <script>
        // now, split text into letters
        const text = document.querySelector('.text');
        text.innerHTML = text.textContent.replace(/\S/g,"<span>$&</span>");

        // now, add actiove class on hovered <span> tag
        const letters = document.querySelectorAll('span');
        for(let i = 0; i <letters.length; i++){
            letters[i].addEventListener('mouseover',function(){
                letters[i].classList.add('active');
            });
        }
    </script>
</body>
</html>
