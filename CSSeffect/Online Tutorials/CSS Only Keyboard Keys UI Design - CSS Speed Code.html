<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 전용 키보드 키 UI 디자인 | CSS 속도 코드</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box; font-family: consolas;}
        body{display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #232323;}
        span{position: relative; display: inline-block; 
            width: 80px; height: 80px; padding: 8px 15px; margin: 8px 4px;
            border-radius: 10px; background: linear-gradient(180deg,#282828,#202020);
            box-shadow: inset -8px 0 8px rgba(0, 0, 0, 0.15),
            inset 0 -8px 8px rgba(0, 0, 0, 0.25),
            0 0 0 2px rgba(0,0,0,0.75) ,
            10px 20px 25px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        span:last-child{
            width: 100%;
        }
        span::before{
            content: ''; position: absolute; top: 3px; left: 4px; bottom: 14px; right: 12px; background: linear-gradient(90deg,#232323,#4a4a4a); border-radius: 10px; 
            box-shadow: -10px -10px 10px rgba(255, 255, 255, 0.25); border-left: 1px solid #0004; border-bottom: 1px solid #0004; border-top: 1px solid #0004;
        }
        span i{
            position: relative; color: white; font-style: normal; font-size: 1.5em;  text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div>
        <span><i>c</i></span>
        <span><i>s</i></span>
        <span><i>s</i></span><br/>
        <span><i>o</i></span>
        <span><i>n</i></span>
        <span><i>l</i></span>
        <span><i>y</i></span><br/>
        <span><i></i></span>
    </div>
</body>
</html>
