<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Animation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        *{margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif;}
        body{background-color: #111;}
        .layer{position: fixed; left: 0; width: 100%; height: 100vh; background: #222;}
        .layer::before{content: ''; position: absolute; left: -40px; width: 80px; height: 200px; background: #222; box-shadow: 0 calc(90vh - 100px) 0 #222;}
        .plane{position: absolute; left: -55vh; height: 100vh;}
        section{height: 200vh; background: url(./bg1.jpg); background-size: cover; background-attachment: fixed;}
        section.sec2{height: 200vh; background: url(./bg2.jpg); background-size: cover; background-position: bottom; background-attachment: fixed;}
        .text{height: 50vh; display: flex; justify-content: center; align-items: center; text-align: center;}
        .text h2{color: #fff; font-size: 3em; font-weight: 200; text-transform: uppercase; letter-spacing: 0.25em;}
        .text h2 span{font-size: 4em; font-weight: 900; letter-spacing: 0em; background: url(./bg2.jpg) bottom / cover fixed; background-clip: text; color: transparent;}
    </style>
</head>
<body>
    <div class="layer">
        <img src="plane.png" class="plane" alt="">
    </div>
    <section></section>
    <div class="text">
        <h2>
            Welcome To<br/>
            <span>THAILAND</span>
        </h2>
    </div>
    <section class="sec2"></section>

    <script>
        let layer = document.querySelector('.layer');
        window.addEventListener('scroll', function(){
            let value = window.scrollY;
            layer.style.left = value * 2 + 'px'
        })
    </script>
</body>
</html>
