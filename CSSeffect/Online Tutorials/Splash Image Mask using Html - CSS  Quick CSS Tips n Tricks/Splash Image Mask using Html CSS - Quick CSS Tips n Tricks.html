<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html CSS를 사용한 스플래시 이미지 마스크 | 빠른 CSS 팁 및 요령</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        section{
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: url(bg.jpg);
            background-size: cover;
        }
        section::before{
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url(splash.jpg);
            background-size: 1800;
            background-position: center;
            mix-blend-mode: screen;
        }
    </style>
</head>
<body>
    <section></section>
</body>
</html>
