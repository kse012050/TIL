    <title>CSS 및 SVG를 사용한 부드러운 애니메이션 Blob | HTML CSS Blob 애니메이션 효과</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        section{
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #250821;
        }
        .blob{
            position: absolute;
            width: 500px;
            height: 500px;
        }
        .blob:nth-child(2){
            filter: blur(50px);
        }
    </style>
</head>
