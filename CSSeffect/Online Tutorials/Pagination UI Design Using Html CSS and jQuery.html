<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>페이지 매김 UI 디자인</title>
    <script src="../jQuery/jquery-3.4.1.js" ></script>
    <script type="text/javascript">
        $(document).ready(function(){
            $('.next').click(function(){
                $('.pagination').find('.pageNumber.active').next().addClass("active");
                $('.pagination').find('.pageNumber.active').prev().removeClass("active");
            });
            $('.prev').click(function(){
                $('.pagination').find('.pageNumber.active').prev().addClass("active");
                $('.pagination').find('.pageNumber.active').next().removeClass("active");
            })
        })
    </script>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1ce37c;
        }
        ul{
            position: relative;
            background: #fff;
            display:flex;
            padding:10px 20px;
            border-radius:50px;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }
        ul li{
            list-style: none;
            line-height:50px;
            margin:0 5px;
        }
        ul li.pageNumber{
            width: 50px;
            height: 50px;
            line-height: 50px;
            text-align: center;
        }
        ul li a{
            display: block;
            text-decoration: none;
            color:#777;
            font-weight: 600;
            border-radius: 50%;
        }
        ul li.pageNumber:hover a,
        ul li.pageNumber.active a{
            background: #333;
            color:#fff;
        }
        ul li:first-child{
            margin-right: 30px;
            font-weight: 700;
            font-size: 20px;
        }
        ul li:last-child{
            margin-left: 30px;
            font-weight: 700;
            font-size: 20px;
        } 
    </style>
</head>
<body>
    
    <ul class="pagination">
        <li><a href="#" class="prev"> prev </a></li>
        <li class="pageNumber active"><a href="#">1</a></li>
        <li class="pageNumber"><a href="#">2</a></li>
        <li class="pageNumber"><a href="#">3</a></li>
        <li class="pageNumber"><a href="#">4</a></li>
        <li class="pageNumber"><a href="#">5</a></li>
        <li class="pageNumber"><a href="#">6</a></li>
        <li><a href="#" class="next"> next </a></li>
    </ul>
</body>
</html>
