<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>CSS Reverse Direction Button Hover Effects</title>
  <style>
    body{
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #000;
      font-family: consolas;
    }
    a{
      position: relative;
      display: inline-block;
      padding: 10px 20px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-decoration: none;
      font-size: 24px;
    }
    a span{
      position: absolute;
      display: block;
      background: #fff;
      transition: transform ease-in-out 0.2s;
    }
    a span:nth-of-type(1){
      top:0;
      left: 0;
      width: 100%;
      height: 1px;
      transform: scaleX(0);
      transform-origin: right;
      transition-delay: 0s;
    }
    a:hover span:nth-of-type(1){
      transform: scaleX(1);
      transform-origin: left;
    }

    a span:nth-of-type(3){
      bottom:0;
      left: 0;
      width: 100%;
      height: 1px;
      transform: scaleX(0);
      transform-origin: left;
      transition-delay: 0.4s;
    }
    a:hover span:nth-of-type(3){
      transform: scaleX(1);
      transform-origin: right;
    }


    a span:nth-of-type(2){
      top:0;
      right: 0;
      width: 1px;
      height: 100%;
      transform: scaleY(0);
      transform-origin: bottom;
      transition-delay: 0.2s;
    }
    a:hover span:nth-of-type(2){
      transform: scaleY(1);
      transform-origin: top;
    }


    a span:nth-of-type(4){
      top:0;
      left: 0;
      width: 1px;
      height: 100%;
      transform: scaleY(0);
      transform-origin: top;
      transition-delay: 0.6s;
    }
    a:hover span:nth-of-type(4){
      transform: scaleY(1);
      transform-origin: bottom;
    }
   

  </style>

</head>
<body>
  <a href="#">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    Button
  </a>
</body>
</html>
