<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript로 CSS 변수를 업데이트하는 방법 | CSS를 동적으로 만들기</title>
    <style>
        *{margin: 0; padding: 0;}
        body{
            background: #000;
        }
        section{
            position: relative;
            width: 100%;
            height: 100vh;
            background: url("https://i.ytimg.com/vi/UMoD_57GlNo/maxresdefault.jpg");
            background-size: cover;
            clip-path: circle(200px at var(--x) var(--y));
        }
    </style>
</head>
<body>
    <section>

    </section>

    <script>
        var pos = document.documentElement;
        pos.addEventListener("mousemove", e => {
            pos.style.setProperty('--x', e.clientX + "px");
            pos.style.setProperty('--y', e.clientY + "px");
        })
    </script>
</body>
</html>
