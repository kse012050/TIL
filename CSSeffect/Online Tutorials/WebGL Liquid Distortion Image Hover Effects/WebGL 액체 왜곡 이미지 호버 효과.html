<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL 액체 왜곡 이미지 호버 효과 - 서버 필요!</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container{
            position: relative;
            width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container .imgBox{
            position: relative;
            width: 400px;
            height: 400px;
            margin: 20px;
        }

        .container .imgBox img{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="imgBox">
            <img src="img01.jpg" alt="">
            <img src="img02.jpg" alt="">
        </div>
        <div class="imgBox">
            <img src="img03.jpg" alt="">
            <img src="img04.jpg" alt="">
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r119/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.3.4/gsap.min.js"></script>
    <script src="hover.js"></script>
    <script>
        Array.from(document.querySelectorAll('.imgBox')).forEach((e) => {
            const imgs = Array.from(e.querySelectorAll('img'));
            new hoverEffect({
                parent: e,
                intensity: 0.3,
                image1: imgs[0].getAttribute('src'),
                image2: imgs[1].getAttribute('src'),
                displacementImage: '1.jpg'
            });
        })
    </script>
</body>
</html>
