<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS + SVG Border Animation</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        body{display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #222;}
        .container{position: relative; display: flex; gap: 80px;}
        .container .box{position: relative; background: #2d2d2d; width: 240px; height: 320px;}
        .container .box svg{position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;}
        .container .box svg rect{fill: none; width: 100%; height: 100%; stroke-width: 4; stroke: #9cdb28; transition: stroke-dashoffset 2.5s ease;
            stroke-dasharray: 1120; /* (2 * (240px + 320px)) */
            stroke-dashoffset: 0;
        }
        .container .box:hover svg rect{
            stroke-dasharray: 1120;
            stroke-dashoffset: 2240;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <svg><rect /></svg>
        </div>
        <div class="box">
            <svg><rect /></svg>
        </div>
    </div>
</body>
</html>
