<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 빛나는 텍스트 타이포그래피 효과 | 빠른 CSS 팁 및 요령</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(#111, #000);
        }
        h2{
            position: relative;
            font-size: 10em;
            text-transform: uppercase;
            color: transparent;
            background: linear-gradient(to bottom, #222 0%, #222 50%, #111 50%, #111 100%);
            -webkit-background-clip: text;
        }
        h2::before{
            content: attr(data-text);
            position: absolute;
            top: 4px;
            left: 4px;
            z-index: -1;
            background: linear-gradient(45deg,#fff,#0f0,#f00,#00f,#0f0);
            -webkit-background-clip: text;
            color: transparent;
        }
        h2::after{
            content: attr(data-text);
            position: absolute;
            top: 4px;
            left: 4px;
            z-index: -1;
            background: linear-gradient(45deg,#fff,#0f0,#f00,#00f,#0f0);
            -webkit-background-clip: text;
            color: transparent;
            filter:  blur(20px);
        }
    </style>
</head>
<body>
    <h2 data-text="Glowing">Glowing</h2>
</body>
</html>
