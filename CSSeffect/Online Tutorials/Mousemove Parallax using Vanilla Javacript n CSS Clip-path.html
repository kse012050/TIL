<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vanilla javascript 및 css clip-path를 사용하는 mousemove parallax</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        *{margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif;}       
        section{
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        section .textBox{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #1897ff;
            /* https://bennettfeely.com/clippy/ */
            clip-path: polygon(0 0, 65% 0, 39% 100%, 0% 100%);
        }
        section h2,
        section .textBox h2{
            position: absolute;
            top: calc(50% - 150px);
            width: 100%;
            text-align: center;
            font-size: 12em;
            color: #fff;
        }
        section h2{
            color: #1897ff;
        }
    </style>
</head>
<body>
    <section>
        <h2 class="layer">Parallax</h2>
        <div class="textBox">
            <h2 class="layer">Parallax</h2>
        </div>
    </section>
    <script>
        document.addEventListener('mousemove',parallax);
        function parallax(e){
            this.querySelectorAll('.layer').forEach(layer => {
                let x = (window.innerWidth - e.pageX * 10) / 100;
                let y = (window.innerHeight - e.pageY * 10) / 100;
                layer.style.transform = `translate(${x}px , ${y}px)`
            })
        }
    </script>
</body>
</html>
