<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CSS Clip Path Hover Circle Hover Effects</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{margin: 0; padding: 0; height: 100vh;}
        .circle{position: absolute; width: 100%; height: 100%; background: #000; transition: 0.5s; z-index: 2;}
        .circle:hover{z-index: 1;}
        .circle:nth-child(1){background: url(http://www.kimcoop.org/news/photo/201612/91578_61950_2818.JPG); background-attachment: fixed; -webkit-clip-path:circle(100px at 0 0);}
        .circle:nth-child(1):hover{clip-path: circle(1200px at 0 0);}
        .circle:nth-child(2){background: url(http://www.topstarnews.net/news/photo/first/201801/img_345748_1.jpg); background-attachment: fixed; clip-path:circle(100px at 100% 0); }
        .circle:nth-child(2):hover{clip-path: circle(1200px at 100% 0);}
        .circle:nth-child(3){background: url(https://scontent-icn1-1.cdninstagram.com/vp/b3252e97ac7dc11efdc6430992ddf516/5D367B2E/t51.2885-15/e35/49906877_172643597059205_7971632126128566676_n.jpg?_nc_ht=scontent-icn1-1.cdninstagram.com); background-attachment: fixed; clip-path:circle(100px at 0 100%); }
        .circle:nth-child(3):hover{clip-path: circle(1200px at 0 100%);}
        .circle:nth-child(4){background: url(http://talkimg.imbc.com/TVianUpload/tvian/TViews/image/2017/11/11/e6QuDpmN72K6636459960769166954.jpg); background-attachment: fixed; clip-path:circle(100px at 100% 100%);}
        .circle:nth-child(4):hover{clip-path: circle(1200px at 100% 100%);}
    </style>
</head>
<body>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</body>
</html>
