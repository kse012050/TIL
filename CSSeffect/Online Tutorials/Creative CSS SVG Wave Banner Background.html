<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창의적인 CSS SVG 웨이브 배너 배경</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        section{
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px;
            box-sizing: border-box;
            background: linear-gradient(180deg , #008aff, #ff137d), url('https://thumb.pann.com/tc_480/https://fimg4.pann.com/new/download.jsp?FileID=47569211') no-repeat;
            background-blend-mode: screen;
            background-size: contain;
        }
        section .content{
            max-width: 700px;
        }
        section .content h2{
            font-size: 3em;
            color: #fff;
        }
        section .content p{
            font-size: 1.2em;
            color: #fff;
        }
        section img{
            position: relative;
            max-width: 350px;
            z-index: 10;
        }
        .wave{
            position: absolute;
            bottom: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <section>
        <div class="content">
            <h2>Wave Shape Banner</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Culpa, pariatur porro? Officiis sed debitis earum rem nobis ipsa quos adipisci ab ipsam exercitationem harum distinctio quasi, maxime quisquam veniam libero?</p>
