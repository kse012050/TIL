<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모던 자바스크립트 버튼 호버 애니메이션 효과</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap');
        *{margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif;}
        body{display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #363a3b;}
        .container{position: relative; display: flex; flex-direction: column; gap: 60px;}
        .btns{position: relative; width: 240px; height: 80px; display: flex; justify-content: center; align-items: center; cursor: pointer; background: rgba(0, 0, 0, 0.1); font-size: 2em; text-transform: uppercase; text-decoration: none; color: #7ef0ff; letter-spacing: 0.1em; transition-duration: 0.5s; transition-delay: 0.5s;}
        .btns:hover{filter: drop-shadow(0 0 10px #7ef0ff) drop-shadow(0 0 30px #7ef0ff); color: #363a3b;}
        .btns span{position: absolute; left: 0; width: 100%; height: 2px; background: #7ef0ff; z-index: -1; transform: scaleX(0); transform-origin: right; transition: transform 0.25s ease-in-out;}
        .btns:hover span{transform: scaleX(1); transform-origin: left;}
    </style>
</head>
<body>
    <div class="container">
        <a href="#" class="btns">Button</a>
        <a href="#" class="btns">Button</a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function(){
            let btns = document.querySelectorAll('.btns');
            btns.forEach(function(btn){
                const spans = [];
                for(let i = 0; i < 40; i++){
                    let span = document.createElement('span');
                    span.style.top = `${i * 2}px`
                    spans.push(span);
                    btn.appendChild(span);

                    let randomDelay = (Math.random() * 0.75) + 0;
                    span.style.transitionDelay = randomDelay + 's';
                }
            })
        })
    </script>
</body>
</html>
