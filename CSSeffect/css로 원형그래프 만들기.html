<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{width: 300px; height: 300px; border-radius: 50%;
            background: conic-gradient(red 50deg, orange 36deg 170deg, yellow 170deg);
            position: relative;
            animation: graph2 3s forwards;
            &::after{
                /* content: ''; position: absolute; left: 0; top: 0; width: 100%; height: 100%; */
                animation: graph 3s;
                background: conic-gradient(transparent 0deg 0deg, white 0deg 360deg);
            }
        }
        @keyframes graph {
            /* 0%{--progress: 0deg;}
            100%{--progress: 360deg;} */
            0%{background: conic-gradient(transparent 0deg 0deg, white 0deg 360deg);}
            100%{background: conic-gradient(transparent 0deg 360deg, white 0deg 360deg);}
        }

        @keyframes graph2 {
            /* 0%{--progress: 0deg;}
            100%{--progress: 360deg;} */
            0%{background: conic-gradient(red 0deg 50deg, orange 36deg 170deg, yellow 170deg);}
            100%{background: conic-gradient(red 0deg 180deg, orange 36deg 170deg, yellow 170deg);}
        }
    </style>
</head>
<body>
    <div>

    </div>
</body>
</html>
