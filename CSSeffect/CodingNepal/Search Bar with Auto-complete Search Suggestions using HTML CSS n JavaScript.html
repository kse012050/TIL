<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML CSS 및 JavaScript를 사용하여 자동 완성 검색 제안이있는 검색 창</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap');
        *{margin: 0; padding: 0; font-family: 'Poppins', sans-serif;}
        body{
            background: #644bff;
            padding: 0 20px;
        }
        .wrapper{
            max-width: 450px;
            margin: 150px auto;
        }
        .wrapper .search-input{
            position: relative;
            background: #fff;
            width: 100%;
            border-radius: 5px;
            box-shadow: 0px 1px 5px 3px rgba(0,0,0,0.12);
        }
        .search-input input{
            height: 55px;
            width: 100%;
            outline: none;
            border: none;
            border-radius: 5px; 
            padding: 0 60px 0 20px;
            font-size: 18px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .search-input .icon{
            height: 55px;
            width: 55px;
            line-height: 55px;
            position: absolute;
            top: 0;
            right: 0;
            text-align: center;
            font-size: 20px;
            color: #644bff;
            cursor: pointer;
        }
        .search-input .autocom-box{
            max-height: 280px;
            overflow-y: auto;
            opacity: 0;
            box-sizing: border-box;
        }

        .search-input.active .autocom-box{
            padding: 10px 8px;
            opacity: 1;
        }

        .autocom-box li{
            list-style: none;
            padding: 8px 12px;
            width: 100%;
            cursor: default;
            box-sizing: border-box;
            display: none;
        }
        .search-input.active .autocom-box li{
            display: block;
        }
        .autocom-box li:hover{
            background: #efefef;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="search-input">
            <input type="text" placeholder="Type to search..">
            <ul class="autocom-box">
                <li onclick="select(this)">Login Form in HTML & CSS</li>
                <li>How to learn HTML & CSS</li>
                <li>How to learn JavaScript</li>
                <li>How to became Freelancer</li>
                <li>How to became Web Designer</li>
            </ul>
            <div class="icon"><i class="fas fa-search"></i></div>
        </div>
    </div>
    <script src="js/Search Bar with Auto-complete Search Suggestions using HTML CSS n JavaScript.js"></script>
    <script>
        // 모든 필수 요소 얻기
        const searchWrapper = document.querySelector(".search-input");
        const inputBox = document.querySelector("input");
        const suggBox = document.querySelector(".autocom-box");

        // 사용자가 아무 키나 누르고 놓으면
        inputBox.onkeyup = (e) => {
            //  console.log(e.target.value);
            let userData = e.target.value;  // 사용자가 입력 한 데이터
            console.log(Boolean(userData));
            let emptyArray = [];
            if(userData){
                emptyArray = suggestions.filter((data)=>{
                    // 배열 값과 사용자 문자를 소문자로 필터링하고 해당 단어 만 반환
                    // 사용자가 입력 한 단어로 시작하는 단어 / 문장
                    return data.toLocaleLowerCase().startsWith(userData.toLocaleLowerCase());
                })
                // console.log(emptyArray);
                emptyArray = emptyArray.map((data)=>{
                    return data = '<li>'+ data +'</li>';
                });
                // console.log(emptyArray);
                searchWrapper.classList.add('active');  // 자동 완성 상자 표시
                showSuggestions(emptyArray);
                let allList = suggBox.querySelectorAll("li");
                for(let i = 0; i < allList.length; i++){
                    // 모든 li 태그에 onclick 속성 추가
                    allList[i].setAttribute("onclick","select(this)");
                }
            }else{
                searchWrapper.classList.remove('active');  // 자동 완성 상자 숨기기
            }
        }

        function select(element){
            let selectUserData = element.textContent;
            console.log(selectUserData);
            inputBox.value = selectUserData; // 사용자가 선택한 목록 항목 데이터를 텍스트 필드에 전달
            searchWrapper.classList.remove('active');  // 자동 완성 상자 숨기기
        }

        function showSuggestions(list){
            let listData;
            if(!list.length){
                userValue = inputBox.value;
                listData = '<li>' + userValue + '</li>';
            }else{
                listData = list.join('');
            }
            suggBox.innerHTML = listData;
        }
    </script>
</body>
</html>
