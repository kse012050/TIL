<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>step.1 달 만들기</title>
    <style>
        body{padding: 0; margin: 0; height: 100vh; background: linear-gradient(0deg , rgba(13,35,93,1) 0% , rgba(0,5,8,1) 70%);}
        #canvas{position: fixed; left: 0; top: 0; width: 100%; height: 100%;}
    </style>
</head>
<body>
      <canvas id="canvas"></canvas>
      <script>
        let canvas , ctx, w, h , moon;

        function  init() {
            canvas = document.querySelector('#canvas');
            ctx = canvas.getContext('2d');
            resizeReset();
            moon = new Moon();
            animationLoop();
        }

        function resizeReset(){
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function animationLoop(){
            ctx.clearRect(0,0,w,h);
            drawScene();
            requestAnimationFrame(animationLoop);
        }

        function drawScene(){
            moon.draw();
        }

        class Moon{
            constructor(){
                this.x = 150;
                this.y = 150;
                this.size = 100;
            }
            draw(){
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x , this.y, this.size, 0 , Math.PI *2);
                ctx.shadowColor = "rgba(254,247,144,.7)";
                ctx.shadowBlur = 70;
                ctx.fillStyle = "rgba(254,247,144,1)";
                ctx.fill();
                ctx.closePath();
                ctx.restore();
            }
        }

        window.addEventListener('DOMContentLoaded',init);
        window.addEventListener('resize',resizeReset);
      </script>
</body>
</html>
