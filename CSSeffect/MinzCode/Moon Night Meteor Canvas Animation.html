<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>step.2 별 만들기</title>
    <style>
        body{padding: 0; margin: 0; height: 100vh; background: linear-gradient(0deg , rgba(13,35,93,1) 0% , rgba(0,5,8,1) 70%);}
        #canvas{position: fixed; left: 0; top: 0; width: 100%; height: 100%;}
    </style>
</head>
<body>
      <canvas id="canvas"></canvas>
      <script>
        let canvas , ctx, w, h , moon , stars = [];

        function  init() {
            canvas = document.querySelector('#canvas');
            ctx = canvas.getContext('2d');
            resizeReset();
            moon = new Moon();
            for(let a = 0; a < w * h * 0.0001; a++){
                stars.push(new Star());
            }
            animationLoop();
        }

        function resizeReset(){
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function animationLoop(){
            ctx.clearRect(0,0,w,h);
            drawScene();
            requestAnimationFrame(animationLoop);
        }

        function drawScene(){
            moon.draw();
            stars.map((star)=>{
                star.update();
                star.draw();
            })
        }

        class Moon{
            constructor(){
                this.x = 150;
                this.y = 150;
                this.size = 100;
            }
            draw(){
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x , this.y, this.size, 0 , Math.PI *2);
                ctx.shadowColor = "rgba(254,247,144,.7)";
                ctx.shadowBlur = 70;
                ctx.fillStyle = "rgba(254,247,144,1)";
                ctx.fill();
                ctx.closePath();
                ctx.restore();
            }
        }

        class Star{
            constructor(){
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * 0.5;
                this.blinkChance = 0.005;
                this.alpha = 1;
                this.alphaChange = 0;
            }

            draw(){
                ctx.beginPath();
                ctx.arc(this.x , this.y, this.size, 0 , Math.PI *2);
                ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
                ctx.fill();
                ctx.closePath();
            } 

            update(){
                if(this.alphaChange === 0 && Math.random() < this.blinkChance){
                    this.alphaChange = -1;
                }else if(this.alphaChange !== 0){
                    this.alpha += this.alphaChange * 0.05;
                    if(this.alpha <= 0){
                        this.alphaChange = 1;
                    }else if(this.alpha >= 1){
                        this.alphaChange = 0;
                    }
                }
            }
        }

        window.addEventListener('DOMContentLoaded',init);
        window.addEventListener('resize',resizeReset);
      </script>
</body>
</html>
