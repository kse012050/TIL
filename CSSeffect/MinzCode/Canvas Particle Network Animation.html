<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캔버스 입자 네트워크 애니메이션</title>
    <style>
        body{padding: 0; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #000;}
        #canvas{display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // 변수 생성
        var w, h, loopId, id, canvas, ctx, particles;

        // 객체 변수 생성
        var options = {
            particleColor : 'rgba(255,255,255)',
            lineColor : 'rgba(0,181,255)',
            particleAmount : 2,
            // 입자 양
            defaultRadius : 2,
            // 기본 반경
            variantRadius : 2,
            // 변형 반경
            defaultSpeed : 1,
            // 기본 속도
            variantSpeed : 1,
            // 변종 속도
            linkRadius : 300
            // 링크 반경
        }

        var rgb = options.lineColor.match(/\d+/g);
        /* 정규 표현식 
            / / 정규표현식 표시
            \d  숫자만 검색
            +   반복 되는 부분을 묶어 준다
            g    전체 검색?

         */
        // var rgb = options.lineColor;
        
        // 페이지가 로드 되면 init 함수 싱행
        document.addEventListener('DOMContentLoaded', init);

        // init 함수
        function init() {
            // canvas 태그 지목
            canvas = document.getElementById('canvas');
            // 지목한 canvas를 2d로 설정
            ctx = canvas.getContext('2d');
            // 함수 실행
            resizeReset();
            initialiseElements();
            startAnimation();
        }

        // 캔버스 사이즈를 웹 화면에 맞춰 설정
        function resizeReset() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function initialiseElements(){
            particles = [];
            // 집합 생성
            for (var i = 0; i < options.particleAmount; i++){
                // options 객체에 들어있는 입자양만큼 반복문 실행
                particles.push(new Particle());
                // 집합에 Particle class 입자양만큼 넣기
            }
        }

        function startAnimation() {
            loopId = requestAnimationFrame(animationLoop);
        }

        function animationLoop() {
            ctx.clearRect(0,0,w,h);
            drawScene();

            // id = requestAnimationFrame(animationLoop);
        }

        function drawScene() {
            drawLine();
            drawParticle();
        }

        function drawParticle() {
            for(var i = 0; i < particles.length; i++){
                particles[i].update();
                particles[i].draw();
            }
        }

        function drawLine() {
            for(var i = 0; i < particles.length; i++){
                linkPoints(particles[i], particles);
            }
        }

        function linkPoints(point, hubs) {
            for (var i = 0; i< hubs.length; i++){
                var distance = checkDistance(point.x, point.y, hubs[i].x, hubs[i].y);
                var opacity = 1 - distance / options.linkRadius;
                if (opacity > 0){
                    ctx.lineWidth = 0.5;
                    ctx.strokeStyle = 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+opacity+')'
                    ctx.beginPath();
                    ctx.moveTo(point.x , point.y);
                    ctx.lineTo(hubs[i].x , hubs[i].y);
                    ctx.closePath();
                    ctx.stroke();
                }
            }
        }

        function checkDistance(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
            // Math.sqrt() 숫자는 제곱근을 반환한다
            
        }

        Particle = function() {
            var _this = this;
            
            _this.x = Math.random() * w;
            // 0 ~ 브라우저의 가로 크기 사이 값을 랜덤으로 받음
            _this.y = Math.random() * h;
            // 0 ~ 브라우저의 세로 크기 사이 값을 랜덤으로 받음
            _this.color = options.particleColor;
            // 변수에 설정해 놓은 하얀색을 받음
            _this.radius = options.defaultRadius + Math.random() * options.variantRadius;
            /* 입자의 크기 지정
                현재 defaultRadius (2) + random(0 ~ 0.999) * variantRadius (2)
                2 ~ 4 사이의 값 반환
             */
            _this.speed = options.defaultSpeed + Math.random() * options.variantSpeed;
            /* 
                입자의 속도 지정
                    현재 defaultSpeed (1) + random(0 ~ 0.999) * variantRadius (2)
                    1 ~ 2 사이의 값 반환
             */
            _this.directionAngle = Math.floor(Math.random() * 360);
            /* 
                방향 각도
                    Math.floor 내림
                    0 ~ 360 사이의 값을 반환 (소수점 X)
             */
            _this.vector = {
                x: Math.cos(_this.directionAngle) * _this.speed,
                y: Math.sin(_this.directionAngle) * _this.speed
            }

            // console.log('direction : ' + _this.directionAngle);
            // console.log('speed : ' + _this.speed);
            // console.log('x : ' + Math.cos(_this.directionAngle));
            // console.log('y : ' + Math.sin(_this.directionAngle));
            // console.log('x : ' + Math.cos(90));
            // console.log('y : ' + Math.sin(90 * Math.PI / 180));
            // console.log(90 * Math.PI / 180);
            // for(var i = 0; i <= 360; i++){
            //     console.log(i + ' : ' + Math.sin(i));
            // }
            // console.log('--------------------------------------------------------------');
                
            _this.update = function() {
                _this.border();
                // Particle 이 모서리에 도달하면 방향을 바꾼다
                _this.x += _this.vector.x;
                // x축으로 _this.vector.x 값의 속도로 이동
                _this.y += _this.vector.y;
                // y축으로 _this.vector.y 값의 속도로 이동
            }
            _this.border = function() {
                if(_this.x > w || _this.x <= 0){
                    _this.vector.x *= -1;
                }
                if(_this.y > h || _this.y <= 0){
                    _this.vector.y *= -1;
                }
                if(_this.x > w) _this.x = w;
                if(_this.y > h) _this.y = h;
                if(_this.x < 0) _this.x = 0;
                if(_this.y < 0) _this.y = 0;
            }
            _this.draw = function() {
                ctx.beginPath();
                ctx.arc(_this.x, _this.y, _this.radius, 0 , Math.PI * 2);
                ctx.closePath();
                ctx.fillStyle = _this.color;
                ctx.fill(); 
            }
        }
    </script>
</body>
</html>
