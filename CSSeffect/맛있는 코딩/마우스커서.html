<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마우스 커서</title>
    <style>
        *{margin: 0; padding: 0;}
        body{background-color: #f1f1f1; font-family: monospace; cursor: none;}
        .carousel{width: 100%; height: 60vh; border: 1px solid #333; box-sizing: border-box; margin-bottom: 30px; font-size: 30px; display: flex; align-items: center; justify-content: center;}
        a{text-decoration: none; color: #333; font-size: 1.5rem;}
        .email{margin-right: 20px;}
        .img{width: 100%; height: 60vh; background-color: #333; margin-top: 50px;}
        #mouse-cursor{position: absolute; top: 0; left: 0; will-change: transform; transform: translate3d(-100%, -100%, 0); pointer-events: none; mix-blend-mode: difference;}
        #mouse-cursor > div{position: relative; width: 30px; height: 30px; background-color: #fff; font-size: 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; --cursor-scale: 1; transform: scale3d(var(--cursor-scale), var(--cursor-scale), 1); will-change: transform; transition: transform 150ms ease-in-out, background-color 150ms ease-in-out;}
        #mouse-cursor > div::after{content: attr(data-name); position: absolute; color: #fff; transform: scale(0.45); white-space: nowrap;}
        #mouse-cursor.cursor-text-mode{mix-blend-mode: initial !important; }
        #mouse-cursor.cursor-text-mode > div{background-color: #333 !important;}
    </style>
</head>
<body>
    <div class="carousel" data-cursor="carousel">
        Carousel
    </div>
    <a href="#" class="email" data-cursor="link" data-name="Send Email">kse012050@gamil.com</a>
    <a href="#" class="address" data-cursor="link" data-name="Show Map">강남구 테헤란로</a>
    <div class="img" data-cursor="img">

    </div>

    <div id="mouse-cursor">
        <div></div>
    </div>

    <script>
        const cursorParent = document.getElementById('mouse-cursor');
        const cursorChild = cursorParent.children[0];
        window.addEventListener('mousemove', mousemove)
        window.addEventListener('mousedown', mousedown)
        window.addEventListener('mouseup', mouseup)

        let scale = 1;
        let stage = ''
        let carouselDirection;
        let cursorX = 0, cursorY = 0
        function mousemove(e){
            cursorX = e.pageX - cursorParent.offsetWidth / 2
            cursorY = e.pageY - cursorParent.offsetHeight / 2
            cursorParent.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`
            switch(e.target.getAttribute('data-cursor')){
                case 'carousel':
                    carouselDirection = cursorX / innerWidth / 2 ? 'Prev' : 'Next'
                    cursorChild.setAttribute('data-name', carouselDirection)
                    if(stage === 'carousel') return
                    scale = 5
                    stage = 'carousel'
                    cursorChild.setAttribute('data-name', e.target.getAttribute('data-name'))
                    cursorParent.className = 'cursor-text-mode'
                    console.log('carousel');
                    break
                case 'link':
                    if(stage === 'link') return
                    scale = 5
                    stage = 'link'
                    cursorChild.setAttribute('data-name', e.target.getAttribute('data-name'))
                    cursorParent.className = 'cursor-text-mode'
                    console.log('link');
                    break
                case 'img':
                    if(stage === 'img') return
                    scale = 1
                    stage = 'img'
                    cursorChild.setAttribute('data-name', '')
                    cursorParent.className = ''
                    console.log('img');
                    break
                default:
                    if(stage === '') return
                    scale = 1
                    stage = ''
                    cursorChild.setAttribute('data-name', '')
                    cursorParent.className = ''
                    console.log('default');
                    break
            }
            cursorChild.style.setProperty('--cursor-scale', scale)
        }
        function mousedown(e){
            scale *= 0.8
            cursorChild.style.setProperty('--cursor-scale', scale)
        }
        function mouseup(e){
            scale *= 1.25
            cursorChild.style.setProperty('--cursor-scale', scale)
        }
    </script>
</body>
</html>
