<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트로 초간단 자석버튼 마스터하기</title>
    <style>
        html, body{width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background-color: #f1f1f1; font-family: 'Raleway', serif;}
        a{background-color: #7319ff; width: 300px; height: 300px; display: flex; justify-content: center; align-items: center; border-radius: 50%; cursor: pointer; transition: transform 100ms ease-out;}
        a > span{font-size: 30px; color: #00ffc6; transition: transform 100ms ease-out;}
    </style>
</head>
<body>
    <a href="">
        <span>GET IN TOUCH</span>
    </a>

    <script>
        function magneticButton(element){
            const children = element.children[0]
            element.addEventListener('mousemove', e => {
                const { offsetLeft, offsetTop, offsetWidth, offsetHeight } = element;
                const left = e.pageX - offsetLeft
                const top = e.pageY - offsetTop
                const centerX = left - offsetWidth / 2
                const centerY = top - offsetHeight / 2
                const d = Math.sqrt(centerX**2 + centerY**2)

                element.style.transform = `
                    translate3d(${centerX / 1.5}px, ${centerY / 1.5}px, 0)
                `

                children.style.transform = `
                    translate3d(${centerX / 4}px, ${centerY / 4}px, 0)
                    rotate3d(${-centerY / 100}, ${centerX / 100}, 0, ${d / 10}deg)
                `
            })

            element.addEventListener('mouseleave', () =>{
                element.style.transform = ``
                children.style.transform = ``
            })
        }


        const a = document.querySelector('a')
        magneticButton(a)
    </script>
</body>
</html>
