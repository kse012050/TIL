<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Parallax Effect Using CSS</title>
    <style>
    body{
        margin: 0;
        padding: 0;
    }
    #box1{
        height: 100vh;
        width: 100%;
        background-image: url(http://image.kmib.co.kr/online_image/2019/0805/611811110013571231_1.jpg);
        background-size: cover;
        display: table;
        background-attachment: fixed;
    }
    #box2{
        height: 100vh;
        width: 100%;
        background-image: url(http://www.newsa.co.kr/news/photo/201805/176201_139019_3222.jpg);
        background-size: cover;
        display: table;
        background-attachment: fixed;
    }
    #box3{
        height: 100vh;
        width: 100%;
        background-image: url(https://newsimg.sedaily.com/2019/02/22/1VFEVTBNOZ_1.jpg);
        background-size: cover;
        display: table;
        background-attachment: fixed;
    }
    h1{
        font-size: 50px;
        color: white;
        margin: 0;
        text-align: center;
        vertical-align: middle;
        display: table-cell;
        vertical-align: middle;
    }
    </style>
</head>
<body>
    <div id="box1">
        <h1>DAFT CREATION</h1>
    </div>
    <div id="box2">
        <h1>DAFT CREATION</h1>
    </div>
    <div id="box3">
        <h1>DAFT CREATION</h1>
    </div>

</body>
</html>
