<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hover로 열리는 메뉴</title>
<script>
  const obj = {
    test1: '1',
    test2: '2',
    test3: '3',
    test4: '4',
  }

  Object.entries(obj).map(([key, value]) => {
    console.log(key, value);
  });
</script>
<style>
  body {
    font-family: sans-serif;
    padding: 40px;
    background: #f5f5f5;
  }

  .menu-wrap {
    display: inline-block;
    position: relative;
  }

  /* 메뉴 버튼 스타일 */
  .menu-btn {
    display: inline-block;
    padding: 10px 16px;
    background: #333;
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
  }

  /* ul 기본 상태 */
  .menu-list {
    list-style: none;
    margin: 6px 0 0;
    padding: 0;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    max-height: 0; /* 닫힌 상태 */
    transition: max-height 0.4s ease;
  }

  /* hover 시 펼쳐지기 */
  .menu-wrap:hover .menu-list {
    max-height: 300px; /* auto 대신 충분히 큰 값 */
  }

  .menu-list li {
    padding: 10px 14px;
    border-bottom: 1px solid #eee;
    transition: background 0.2s;
  }

  .menu-list li:last-child {
    border-bottom: none;
  }

  .menu-list li:hover {
    background: #f7f7f7;
  }
</style>
</head>
<body>

<div class="menu-wrap">
  <div class="menu-btn">메뉴 보기</div>
  <ul class="menu-list">
    <li>항목 1</li>
    <li>항목 2</li>
    <li>항목 3</li>
    <li>항목 4</li>
  </ul>
</div>

</body>
</html>
