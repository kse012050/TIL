<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View Transition Demo</title>
    <style>
        :root{color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7f8; color: #172026;}
        *{box-sizing: border-box;}
        body{margin: 0; min-height: 100vh;}
        button{font: inherit;}
        .app{width: min(100% - 32px, 980px); margin: 0 auto; padding: 32px 0;}
        .topbar{display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px;}
        h1, h2, p{margin: 0;}
        h1{font-size: clamp(1.75rem, 4vw, 3rem); line-height: 1.05;}
        .hint{max-width: 58ch; margin-top: 8px; color: #52616b; line-height: 1.6;}
        .status{flex: 0 0 auto; padding: 8px 10px; border: 1px solid #cbd5d8; border-radius: 8px; background: #ffffff; color: #40515c; font-size: 0.9rem;}
        .grid{display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px;}
        .product{position: relative; display: grid; min-height: 280px; padding: 0; overflow: hidden; border: 1px solid #d5dde0; border-radius: 8px; background: #ffffff; color: inherit; text-align: left; cursor: pointer; view-transition-class: product-card;}
        .product:focus-visible, .back:focus-visible{outline: 3px solid #1e7f70; outline-offset: 3px;}
        .product__art, .detail__art{display: grid; place-items: center; min-height: 170px; color: #ffffff; font-weight: 800; font-size: 3rem;}
        .product__body, .detail__body{padding: 18px;}
        .product__meta, .detail__meta{margin-top: 8px; color: #52616b; line-height: 1.55;}
        .detail{display: grid; grid-template-columns: minmax(260px, 0.85fr) minmax(280px, 1fr); overflow: hidden; border: 1px solid #d5dde0; border-radius: 8px; background: #ffffff; view-transition-class: product-card;}
        .detail__art{min-height: 440px; font-size: clamp(4rem, 12vw, 7rem);}
        .detail__body{display: flex; flex-direction: column; justify-content: center; gap: 18px;}
        .back{align-self: start; border: 1px solid #172026; border-radius: 8px; padding: 10px 14px; background: #172026; color: #ffffff; cursor: pointer;}
        .swatches{display: flex; gap: 8px;}
        .swatch{width: 36px; aspect-ratio: 1; border: 1px solid rgb(0 0 0 / 0.14); border-radius: 50%;}
        .tone-a{background: linear-gradient(135deg, rgb(20 96 118 / 0.9), transparent 55%), #e25d45;}
        .tone-b{background: linear-gradient(135deg, rgb(34 122 88 / 0.9), transparent 55%), #d69b24;}
        .tone-c{background: linear-gradient(135deg, rgb(94 74 150 / 0.9), transparent 55%), #2f9db2;}
        .tone-d{background: linear-gradient(135deg, rgb(151 61 76 / 0.9), transparent 55%), #6aa84f;}
        ::view-transition-group(active-card){
            animation-duration: 520ms;
            animation-timing-function: cubic-bezier(.2, .8, .2, 1);
        }

        ::view-transition-image-pair(active-card){
            isolation: isolate;
            overflow: clip;
            border-radius: 8px;
        }

        ::view-transition-old(active-card){
            object-fit: cover;
            animation: card-out 520ms cubic-bezier(.2, .8, .2, 1) both;
        }

        ::view-transition-new(active-card){
            object-fit: cover;
            animation: card-in 520ms cubic-bezier(.2, .8, .2, 1) both;
        }

        ::view-transition-group(.product-card){
            animation-duration: 520ms;
        }

        @keyframes card-out{
            to{
                opacity: 0;
                transform: scale(.96);
            }
        }

        @keyframes card-in{
            from{
                opacity: 0;
                transform: scale(1.04);
            }
        }

        @media (max-width: 720px){
            .topbar{
                display: block;
            }

            .status{
                display: inline-block;
                margin-top: 16px;
            }

            .detail{
                grid-template-columns: 1fr;
            }

            .detail__art{
                min-height: 260px;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="topbar">
            <div>
                <h1>View Transition 예제</h1>
                <p class="hint">
                    카드를 선택하면 같은 `view-transition-name`을 공유하는 목록 카드와 상세 화면이
                    하나의 전환 그룹으로 연결됩니다.
                </p>
            </div>
            <span class="status" id="support"></span>
        </header>

        <section id="stage" aria-live="polite"></section>
    </main>

    <script>
        const products = [
            {
                id: 1,
                name: "Coral Speaker",
                mark: "C",
                tone: "tone-a",
                text: "작은 카드가 상세 패널로 커지며 old/new 이미지 쌍이 교차됩니다.",
                colors: ["#e25d45", "#146076", "#f1c453"]
            },
            {
                id: 2,
                name: "Moss Lamp",
                mark: "M",
                tone: "tone-b",
                text: "전환 대상 요소에는 고유한 이름이 필요하고, class는 공통 스타일링에 씁니다.",
                colors: ["#227a58", "#d69b24", "#f7f2e8"]
            },
            {
                id: 3,
                name: "Sky Notebook",
                mark: "S",
                tone: "tone-c",
                text: "pseudo-element 선택자로 전환의 그룹, 이미지 쌍, 이전/이후 상태를 다룹니다.",
                colors: ["#5e4a96", "#2f9db2", "#f0f6f8"]
            },
            {
                id: 4,
                name: "Leaf Clock",
                mark: "L",
                tone: "tone-d",
                text: "지원하지 않는 브라우저에서는 상태 변경만 실행되도록 fallback을 둡니다.",
                colors: ["#973d4c", "#6aa84f", "#f4df9b"]
            }
        ];

        const stage = document.querySelector("#stage");
        const support = document.querySelector("#support");

        support.textContent = document.startViewTransition
            ? "View Transition 지원"
            : "Fallback 모드";

        function runTransition(updateView) {
            if (!document.startViewTransition) {
                updateView();
                return Promise.resolve();
            }

            const transition = document.startViewTransition(updateView);
            return transition.finished.catch(() => {});
        }

        function clearActiveNames() {
            stage.querySelectorAll(".product").forEach((button) => {
                button.style.removeProperty("view-transition-name");
            });
        }

        function renderList(activeId) {
            stage.innerHTML = `
                <div class="grid">
                    ${products.map((product) => `
                        <button
                            class="product"
                            data-id="${product.id}"
                            style="${product.id === activeId ? "view-transition-name: active-card" : ""}"
                            type="button"
                        >
                            <span class="product__art ${product.tone}" aria-hidden="true">${product.mark}</span>
                            <span class="product__body">
                                <strong>${product.name}</strong>
                                <span class="product__meta">${product.text}</span>
                            </span>
                        </button>
                    `).join("")}
                </div>
            `;

            stage.querySelectorAll(".product").forEach((button) => {
                button.addEventListener("click", () => {
                    const product = products.find((item) => item.id === Number(button.dataset.id));
                    clearActiveNames();
                    button.style.viewTransitionName = "active-card";
                    runTransition(() => renderDetail(product));
                });
            });
        }

        function renderDetail(product) {
            stage.innerHTML = `
                <article class="detail" style="view-transition-name: active-card">
                    <div class="detail__art ${product.tone}" aria-hidden="true">${product.mark}</div>
                    <div class="detail__body">
                        <button class="back" type="button">목록으로</button>
                        <div>
                            <h2>${product.name}</h2>
                            <p class="detail__meta">${product.text}</p>
                        </div>
                        <div class="swatches" aria-label="색상 샘플">
                            ${product.colors.map((color) => `
                                <span class="swatch" style="background:${color}"></span>
                            `).join("")}
                        </div>
                    </div>
                </article>
            `;

            stage.querySelector(".back").addEventListener("click", () => {
                runTransition(() => renderList(product.id)).then(clearActiveNames);
            });
        }

        renderList();
    </script>
</body>
</html>
