<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>focus-within 테스트</title>
    <style>
        ul{margin: 0; padding: 0; list-style: none; padding: 50px; border: 1px solid rgba(0, 0, 0, 0.5);}
        /* ul li{padding: 50px; border: 1px solid rgba(0, 0, 0, 0.2);}
        ul li:focus-within{background-color: dodgerblue;} */
        ul:focus-within{background-color: lightblue;}
        .focus01:focus{outline: none;}
        .focus02:focus-visible{outline: none;}
        .focus03:focus{outline: 2px solid red;}
        .focus04:focus-visible{outline: 2px solid red;}
    </style>
</head>
<body>
    <ul>
        <li>
            <button class="focus01">포커스 테스트</button>
        </li>
        <li>
            <button class="focus02">포커스 테스트</button>
        </li>
        <li>
            <input type="text" class="focus03">
        </li>
        <li>
            <input type="text" class="focus04">
        </li>
    </ul>
    <script>
        console.log(document.querySelector('.focus01'));
        document.querySelector('.focus01').addEventListener('click',function(){
            alert('포커스 01')
        })
        document.querySelector('.focus02').addEventListener('click',function(){
            alert('포커스 02')
        })
    </script>
</body>
</html>
