<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>focus-within 테스트</title>
    <style>
        ul{margin: 0; padding: 0; list-style: none; padding: 50px; border: 1px solid rgba(0, 0, 0, 0.5);}
        ul li{padding: 50px; border: 1px solid rgba(0, 0, 0, 0.2);}
        ul:focus-within{background-color: lightblue;}
        ul li:focus-within{background-color: dodgerblue;}
    </style>
</head>
<body>
    <ul>
        <li>
            <input type="text">
        </li>
        <li>
            <input type="text">
        </li>
        <li>
            <input type="text">
        </li>
        <li>
            <input type="text">
        </li>
    </ul>
</body>
</html>
