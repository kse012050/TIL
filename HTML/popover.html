<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{height: 5000px;}
        body:has([popover]:popover-open){overflow: hidden;}
        div:has([popover]:popover-open){width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; box-sizing: border-box; position: fixed; left: 0; top: 0; z-index: 1000;}
        /* [popover] div{width: 300px; height: 200px; background-color: white;} */
    </style>
</head>
<body>
    <button popovertarget="my-popover">열기</button>
    <div>
        <div popover id="my-popover">
            Greetings, one and all!
            <button popovertarget="my-popover" popovertargetaction="hidden">닫기</button>
        </div>
    </div>
    <strong>strong</strong>
</body>
</html>
