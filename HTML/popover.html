<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{height: 5000px;}
        body:has([popover]:popover-open){overflow: hidden;}
        [popover]:popover-open::backdrop{background-color: rgba(0, 0, 0, 0.5);}
        /* 뒷 배경 색상 추가 및 변경 */
    </style>
</head>
<body>
    <button popovertarget="my-popover">열기</button>
    <div popover id="my-popover">
        Greetings, one and all!
        <button popovertarget="my-popover" popovertargetaction="hidden">닫기</button>
    </div>
    <strong>strong</strong>
    <a href="https://mdn.github.io/dom-examples/popover-api/" target="_blank">MDN 예제</a>
    <script>
        const popover = document.getElementById("my-popover");
        popover.showPopover()
        // 첫 화면 렌더링 될 때 팝업 띄우는 방법

        // 열림 / 닫힘 이벤트 실행 전 적용
        popover.addEventListener('beforetoggle', (event) => {
            if (popover.matches(':popover-open')) {
                console.log('beforetoggle 팝업이 열렸습니다.');
            } else {
                console.log('beforetoggle 팝업이 닫혔습니다.');
                // 팝업이 닫힐 때 실행할 코드
            }
        });
        // 열림 / 닫힘 이벤트 실행 후 적용
        popover.addEventListener('toggle', (event) => {
            if (popover.matches(':popover-open')) {
                console.log('toggle 팝업이 열렸습니다.');
            } else {
                console.log('toggle 팝업이 닫혔습니다.');
                // 팝업이 닫힐 때 실행할 코드
            }
        });
    </script>
</body>
</html>
